name: build-win7

on:
  push:
    branches: [main]
    paths:
      - 'mac-screen/**'
      - '.github/workflows/build-win7.yml'
  workflow_dispatch:

jobs:
  build-win7:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mac-screen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 跟本地一致 (npm 11.12 / node 24), 避免 lockfile 版本不兼容
          node-version: '24'
      # 用 install 而不是 ci: 仓库里的 lockfile 仍是 Electron 44, ci 会按 lock 装错版本.
      # install 会按 package.json 的 ^22.3.27 重新解析并装到正确版本.
      - name: Install dependencies (resolves Electron ^22.3.27)
        run: npm install --no-audit --no-fund
      - name: Build Windows x64 portable
        run: npx --no-install electron-builder --win portable --x64
      - uses: actions/upload-artifact@v4
        with:
          name: class-call-screen-win7-x64
          path: mac-screen/dist/*.exe
          if-no-files-found: error
          retention-days: 14