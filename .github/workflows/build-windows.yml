name: build-windows

on:
  push:
    branches: [main]
    paths:
      - 'mac-screen/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win7
            electron: ^22.3.27
            label: Win7 x64 (Electron 22.3.27 · 最后支持 Win7 的版本)
          - target: latest
            electron: ^44.2.0
            label: Win10/11 x64 (Electron 44.x · 当前版本)
    defaults:
      run:
        working-directory: mac-screen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies (electron ${{ matrix.electron }} + electron-builder)
        run: npm install --no-save --no-audit --no-fund electron@${{ matrix.electron }} electron-builder@^26.15.3

      # 输出完整捕获到 build.log, 即便 fail 也保留, 通过下一个 artifact step 上传
      - name: Build ${{ matrix.label }} portable
        shell: bash
        run: |
          set +e
          npx --no-install electron-builder --win portable --x64 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          echo "=== exit: $rc ==="
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: class-call-screen-${{ matrix.target }}-x64
          path: mac-screen/dist/*.exe
          if-no-files-found: error
          retention-days: 14

      # 始终上传 build.log, 用于失败时定位根因
      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: mac-screen/build.log
          if-no-files-found: ignore
          retention-days: 7

  bundle-win7-deps:
    name: Bundle Win7 offline deps (VC++ + 3 KB MSU)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download VC++ + 3 KB MSU + write install.bat + zip
        shell: pwsh
        run: ./mac-screen/scripts/bundle-win7-deps.ps1
      - name: Upload Win7 offline deps bundle
        uses: actions/upload-artifact@v4
        with:
          name: class-call-screen-win7-deps
          path: mac-screen/win7-deps.zip
          if-no-files-found: error
          retention-days: 90