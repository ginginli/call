name: build-windows

on:
  push:
    branches: [main]
    paths:
      - 'mac-screen/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win7
            electron: ^22.3.27
            label: Win7 x64 (Electron 22.3.27 · 最后支持 Win7 的版本)
          - target: latest
            electron: ^44.2.0
            label: Win10/11 x64 (Electron 44.x · 当前版本)
    defaults:
      run:
        working-directory: mac-screen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies (electron ${{ matrix.electron }} + electron-builder)
        run: npm install --no-save --no-audit --no-fund electron@${{ matrix.electron }} electron-builder@^26.15.3

      # 诊断 step: 上一次失败原因是 exit code 1 但日志空, 加前置探针确认 cwd / 文件 / 版本 / icon
      - name: Build ${{ matrix.label }} portable (with diagnostics)
        shell: bash
        run: |
          set +e
          echo "=== pwd ==="
          pwd
          echo "=== ls (top of mac-screen) ==="
          ls -la
          echo "=== package.json ==="
          cat package.json
          echo "=== build/ dir (icon?) ==="
          ls -la build/ 2>&1 || echo "(no build/ dir)"
          echo "=== electron --version ==="
          npx --no-install electron --version
          echo "=== electron-builder --version ==="
          npx --no-install electron-builder --version
          echo "=== run electron-builder ==="
          npx --no-install electron-builder --win portable --x64
          rc=$?
          echo "=== exit: $rc ==="
          exit $rc

      - uses: actions/upload-artifact@v4
        with:
          name: class-call-screen-${{ matrix.target }}-x64
          path: mac-screen/dist/*.exe
          if-no-files-found: error
          retention-days: 14