<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>班级喊话 · 演示屏</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;color:#e5e7eb;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center}
  .box{text-align:center;padding:36px;max-width:520px}
  .icon{font-size:52px}
  h1{font-size:21px;margin:14px 0 8px}
  p{color:#9ca3af;line-height:1.7;margin:0 0 22px;font-size:14px;white-space:pre-line}
  .btn{background:#4f46e5;color:#fff;border:none;border-radius:10px;
    padding:12px 26px;font-size:15px;cursor:pointer;margin:4px 6px}
  .btn.ghost{background:rgba(255,255,255,.12)}
  .status{font-size:12px;color:#6b7280;margin-top:16px;letter-spacing:.3px}
  .spin{display:inline-block;animation:spin 1.2s linear infinite;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📡</div>
    <h1>连接班级喊话服务失败</h1>
    <p id="why">请检查教室网络是否通畅, 软件会自动重试连接, 无需任何操作。</p>
    <div>
      <button class="btn" id="retryBtn">立即重试</button>
      <button class="btn ghost" onclick="window.desktopApp && window.desktopApp.quit()">退出</button>
    </div>
    <div class="status"><span class="spin">↻</span><span id="status">5 秒后自动重试…</span></div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    try {
      const q = new URLSearchParams(location.search);
      const r = q.get('reason');
      if (r) $('why').textContent = decodeURIComponent(r);
    } catch (e) {}
    // 服务地址已锁定, 老师不需要填写. 仅在 background 自动重试 + 提供"立即重试/退出".
    let countdown = 5;
    let timer = null;
    function tick() {
      $('status').textContent = countdown + ' 秒后自动重试…';
      if (countdown <= 0) {
        countdown = 5;
        try { window.desktopApp && window.desktopApp.retry(); } catch (e) {}
      }
      countdown -= 1;
    }
    if (window.desktopApp) {
      $('retryBtn').onclick = () => { countdown = 5; try { window.desktopApp.retry(); } catch (e) {} };
      timer = setInterval(tick, 1000);
    }
  </script>
</body>
</html>
