<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Broadcast System · Console</title>
<link rel="stylesheet" href="/style.css">
<style>
  details.fold{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
  details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 16px;font-size:14px;color:var(--text)}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold .fold-t{font-weight:700;font-size:15px}
  details.fold .fold-open{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
  details.fold .fold-body{padding:0 16px 14px}
  details.fold[open]>summary{border-bottom:1px solid var(--line)}
  /* trial account guide */
  .trial-bar{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;border:1px solid #ddd6fe;border-radius:14px;background:linear-gradient(135deg,#f5f3ff,#eef2ff);padding:16px 18px}
  .trial-main{flex:1;min-width:260px}
  .trial-h{font-weight:800;font-size:15px;color:#4338ca;margin-bottom:6px}
  .trial-p{font-size:13px;color:#4b5563;line-height:1.7;margin-bottom:12px}
  .trial-steps{display:flex;gap:10px;flex-wrap:wrap}
  .trial-step{flex:1;min-width:165px;text-align:left;background:#fff;border:1px solid #e0e7ff;border-radius:11px;padding:11px 13px;font:inherit;transition:.15s}
  .trial-step.go{cursor:pointer;border-color:#c7d2fe}
  .trial-step.go:hover{border-color:#818cf8;box-shadow:0 6px 16px rgba(79,70,229,.14)}
  .trial-step b{display:block;font-size:13.5px;color:#312e81;margin-bottom:3px}
  .trial-step span{font-size:12px;color:#6b7280;line-height:1.5}
  .trial-cta{text-align:right}
  .trial-note{font-size:11.5px;color:#9ca3af;margin-top:8px}
</style>
</head>
<body>

<header class="topbar">
  <a class="mini-logo" href="/en/" title="Back to home">
    <div class="logo">📢</div>
    <span>Class Broadcast System</span>
  </a>
  <div class="row" style="gap:10px">
    <span class="badge badge-pri" id="uType"></span>
    <span class="muted" id="uQuota"></span>
    <span style="font-weight:600" id="uName"></span>
    <select class="lang-select" title="Language" aria-label="Language" onchange="if(this.value)location.href=this.value">
      <option value="/app">简体</option>
      <option value="/zh-Hant/app">繁體</option>
      <option value="/en/app" selected>English</option>
    </select>
    <button class="btn btn-sm btn-danger" id="btnLogout" onclick="doLogout()" data-ga="logout" data-ga-pos="topbar">Sign out</button>
  </div>
</header>

<div id="inviteBox" style="max-width:1240px;margin:14px auto 0;padding:0 18px"></div>
<div id="joinBox" style="max-width:1240px;margin:10px auto 0;padding:0 18px"></div>
<div id="trialBox" style="max-width:1240px;margin:10px auto 0;padding:0 18px"></div>

<main class="layout">
  <aside class="side">
    <div class="spread">
      <div class="muted" style="font-weight:600">My classes</div>
      <div class="row">
        <span class="badge" id="sideCount">0</span>
      </div>
    </div>
    <div id="classList" class="side-scroll" style="flex-direction:column"></div>

    <div id="createWrap" style="display:flex;gap:8px;flex-direction:column"></div>
    <div class="muted" id="quotaTip" style="font-size:12px"></div>
  </aside>

  <section class="content" id="content">
    <div class="card empty-state" id="emptyBox" style="display:none">
      <div class="big">🗂️</div>
      <h3 id="emptyTitle">No classes yet</h3>
      <p id="emptyDesc"></p>
    </div>
    <div id="contentBody" style="display:flex;flex-direction:column;gap:16px"></div>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/en/common.js"></script>
<script>
const COLORS = ['#e11d48', '#2563eb', '#16a34a', '#f59e0b', '#9333ea'];
let ME = null;          // data returned by /api/me
let curId = null;       // currently selected class id
let cur = null;         // copy of the current class object
let msgColor = COLORS[0];

/* ================= trial account guide (trial accounts only) ================= */
function renderTrial() {
  const box = document.getElementById('trialBox');
  const u = ME.user;
  if (!u.trial) { box.innerHTML = ''; return; }
  const cls = ME.classes.find((c) => c.isOwner);
  const code = (cls && cls.bindCode) || '';
  box.innerHTML = `
    <div class="trial-bar">
      <div class="trial-main">
        <div class="trial-h">🧪 Demo mode: you are using the temporary account “${esc(u.username)}”</div>
        <div class="trial-p">This is not a real account — <b>it and all of its data are wiped after 24 hours</b> (the features are real, they just do not last). Three steps and you will see the whole loop: a teacher sends one line from the office, and the classroom screen pops up full-screen and reads it aloud.</div>
        <div class="trial-steps">
          <button type="button" class="trial-step go" data-ga="open_room" data-ga-pos="trial_bar" onclick="trialOpenRoom('${esc(code)}')">
            <b>1. Open the classroom screen</b>
            <span>Opens a new window with the bind code ${esc(code)} filled in</span>
          </button>
          <div class="trial-step">
            <b>2. Send a notice</b>
            <span>Type a line in the box on the right and hit Send</span>
          </div>
          <div class="trial-step">
            <b>3. Watch it pop up</b>
            <span>The other window goes full-screen and reads it aloud</span>
          </div>
        </div>
      </div>
      <div class="trial-cta">
        <a class="btn btn-pri" href="/en/#card" data-ga="apply_full_access" data-ga-pos="trial_bar">Get full access — free</a>
        <div class="trial-note">Demo account only — everything is wiped after 24 hours · <a href="/en/" data-ga="back_home" data-ga-pos="trial_bar">Back to home</a></div>
      </div>
    </div>`;
}

function trialOpenRoom(code) {
  window.open('/en/room' + (code ? '?code=' + encodeURIComponent(code) : ''), '_blank');
  toast('Classroom screen opened in a new window — drag it to another display, or keep it next to this page');
}

/* ================= basic rendering ================= */
function boot() {
  renderTop();
  renderSide();
  renderInvites();
  renderJoinBox();
  renderQuotaTip();
  curId = curId && ME.classes.some((c) => c.id === curId) ? curId : (ME.classes[0] ? ME.classes[0].id : null);
  if (curId) selectClass(curId);
  else showEmpty();
}

function renderTop() {
  const u = ME.user;
  document.getElementById('uName').textContent = u.username;
  document.getElementById('uType').textContent = u.trial ? 'Trial account' : (u.type === 'co' ? 'Co-teacher' : 'Owner');
  document.getElementById('uType').className = 'badge ' + ((u.trial || u.type === 'co') ? 'badge-warn' : 'badge-pri');
  document.getElementById('uQuota').textContent = u.type === 'owner'
    ? ((u.ownedCount || 0) + ' / ' + (u.classLimit || 0) + ' classes created') : '';
  const lo = document.getElementById('btnLogout');
  if (lo) lo.textContent = u.trial ? 'Exit demo' : 'Sign out';
}

function renderSide() {
  const box = document.getElementById('classList');
  const owned = ME.classes.filter((c) => c.isOwner);
  const shared = ME.classes.filter((c) => !c.isOwner);
  const item = (c) => `
    <div class="class-item ${c.id === curId ? 'on' : ''}" data-ga="switch_class" data-ga-pos="sidebar" onclick="selectClass('${c.id}')">
      <span class="dot ${c.online ? 'on' : 'off'}"></span>
      <div class="grow" style="min-width:0">
        <div class="cname">${esc(c.name)}</div>
        <div class="tag">${c.isOwner ? 'Created by me' : 'Co-teacher · ' + esc(c.ownerName || '')}</div>
      </div>
      ${!c.isOwner ? '' : (c.pendingInvites ? `<span class="badge badge-warn">${c.pendingInvites} invited</span>` : '')}
    </div>`;
  let html = owned.map(item).join('') + (owned.length && shared.length ? '<div class="muted" style="padding:6px 4px;font-size:12px">Joined classes</div>' : '') + shared.map(item).join('');
  if (!ME.classes.length) html = '<div class="muted" style="padding:10px;font-size:13px;text-align:center">No classes yet</div>';
  box.innerHTML = html;
  document.getElementById('sideCount').textContent = ME.classes.length;

  const wrap = document.getElementById('createWrap');
  if (ME.user.type === 'owner') {
    wrap.innerHTML = `
      <div style="display:flex;gap:8px">
        <input class="inp grow" id="newName" maxlength="20" placeholder="New class name, e.g. Grade 3 Class 2">
        <button class="btn btn-pri" data-ga="create_class" data-ga-pos="sidebar" onclick="doCreate()">Create</button>
      </div>`;
  } else wrap.innerHTML = '';
}

function renderQuotaTip() {
  const t = document.getElementById('quotaTip');
  if (ME.user.type === 'co') t.textContent = 'As a co-teacher, enter the invite code from the class owner to join a class and send notices.';
  else t.innerHTML = 'Each owner account includes 2 classes. Contact support for more.';
}

function showEmpty() {
  const eb = document.getElementById('emptyBox');
  eb.style.display = 'block';
  const isCo = ME.user.type === 'co';
  document.getElementById('emptyTitle').textContent = isCo ? 'No classes joined yet' : 'No classes yet';
  document.getElementById('emptyDesc').textContent = isCo
    ? 'Enter the invite code from the class owner under “Join class” above to join and start sending notices.'
    : 'Type a class name above and click “Create” to get its bind code.';
  const body = document.getElementById('contentBody');
  if (body) body.innerHTML = '';
}

/* ================= invitation banners ================= */
function renderInvites() {
  const box = document.getElementById('inviteBox');
  if (!ME.invites.length) { box.innerHTML = ''; return; }
  box.innerHTML = ME.invites.map((iv) => `
    <div class="card" style="padding:12px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="badge badge-warn" style="font-size:13px">📨 Invitation</span>
      <div class="grow">
        <b>${esc(iv.ownerName)}</b> invited you to join class <b>${esc(iv.className)}</b>. Accept to start sending notices.
      </div>
      <button class="btn btn-pri btn-sm" data-ga="invite_accept" data-ga-pos="invite_banner" onclick="handleInvite('${iv.id}','accept')">Accept</button>
      <button class="btn btn-sm" data-ga="invite_reject" data-ga-pos="invite_banner" onclick="handleInvite('${iv.id}','reject')">Decline</button>
    </div>`).join('');
}

/* ================= class content ================= */
async function selectClass(id) {
  curId = id;
  cur = ME.classes.find((c) => c.id === id);
  if (!cur) return;
  document.getElementById('emptyBox').style.display = 'none';
  msgColor = cur.color || COLORS[0];
  renderSide();
  renderContent();
  refreshNotifs();
  refreshJobs();
}

function renderContent() {
  const c = cur;
  const isOwner = c.isOwner;
  const box = document.getElementById('contentBody');
  const u = ME.user;
  box.innerHTML = `
  <div class="card" style="padding:16px 18px;order:-2" id="clsPane">
    <div class="spread" style="flex-wrap:wrap;gap:10px">
      <div class="row" style="gap:12px;min-width:0">
        <h2 style="margin:0;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="clsName">${esc(c.name)}</h2>
        ${c.isOwner ? '<span class="badge badge-pri">My class</span>' : '<span class="badge badge-warn">Shared with me</span>'}
        <span class="dotbox" data-cid="${c.id}" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)">
          <span class="dot ${c.online ? 'on' : 'off'}"></span><span class="st">${c.online ? 'Classroom online' : 'Classroom offline'}</span>
        </span>
      </div>
      <div class="row" style="flex-wrap:wrap;gap:8px;align-items:center">
        ${isOwner ? `
        <span class="muted" style="font-size:13px">Bind code</span>
        <code id="bindCode" class="mono" style="font-size:15px;background:#f3f4fb;padding:4px 10px;border-radius:6px;color:#1e2434">${esc(c.bindCode || '')}</code>
        <button class="btn btn-sm" data-ga="copy_bind" data-ga-pos="class_head" onclick="copyBind()">Copy</button>` : ''}
        <button class="btn btn-sm" data-ga="remote_minimize" data-ga-pos="class_head" onclick="remoteMinimize()">📥 Minimize notice screen</button>
        ${isOwner ? `
          <button class="btn btn-sm" data-ga="rename_class" data-ga-pos="class_head" onclick="toggleRename()" id="btnRename">✎ Rename</button>
          <button class="btn btn-sm btn-danger" data-ga="delete_class" data-ga-pos="class_head" onclick="doDeleteClass()">Delete class</button>` : `
          <button class="btn btn-sm btn-danger" data-ga="leave_class" data-ga-pos="class_head" onclick="doLeave()">Leave class</button>`}
      </div>
    </div>
    <div id="renameBox" class="hide" style="margin-top:10px;display:flex;gap:8px"></div>
  </div>

  ${isOwner ? '' : `
  <div class="card" style="padding:14px 18px;font-size:13px;color:var(--muted)">
    You are <b style="color:#374151">${esc(u.username)}</b> (co-teacher), invited to this class by <b style="color:#374151">${esc(c.ownerName || '')}</b>. You can send notices directly.
  </div>`}

  <div class="card" style="padding:16px 18px;order:-1">
    <div style="font-weight:700;font-size:15px;margin-bottom:10px">Send a notice</div>
    <textarea class="inp" id="txtContent" rows="3" maxlength="500" placeholder="Message to broadcast, e.g. All Grade 3 Class 2 students, please gather at the playground."></textarea>

    <details class="fold" style="margin-top:10px" open>
      <summary>
        <span class="fold-t">⚙️ On-screen duration / Scheduling</span>
        <span class="fold-open">Expand ▾</span>
      </summary>
      <div class="fold-body">
        <div class="row" style="gap:14px;flex-wrap:wrap;align-items:center;padding:8px 0">
          <label class="row" style="gap:6px;align-items:center">
            <span class="muted" style="font-size:13px">Pop-up duration</span>
            <select class="sel" id="selDuration" style="width:auto" onchange="onDurChange()">
              <option value="min">Minutes</option>
              <option value="hour">Hours</option>
              <option value="-1" selected>Always show until closed</option>
            </select>
            <span id="durInputWrap" class="row hide" style="gap:6px;align-items:center">
              <input class="inp" id="inpDurNum" type="number" min="1" value="5" style="width:70px;padding:8px 10px">
              <span id="durUnit" class="muted" style="font-size:13px">min</span>
            </span>
          </label>
          <label class="row" style="gap:6px">
            <span class="muted" style="font-size:13px">Send mode</span>
            <select class="sel" id="selMode" style="width:auto" onchange="onModeChange()">
              <option value="now">Send now</option>
              <option value="once">Schedule (date &amp; time)</option>
              <option value="daily">Daily at a fixed time</option>
            </select>
          </label>
        </div>
        <div class="muted" id="durTip" style="font-size:12px;padding:0 0 6px;display:none">With “Always show”, the notice stays on the classroom screen until someone taps 【Minimize to corner】 in the classroom, or you use “📥 Minimize notice screen” above.</div>
        <div id="cfgOnce" class="hide row" style="gap:8px;align-items:center">
          <span class="muted" style="font-size:13px">Send at</span>
          <input class="inp" type="datetime-local" id="inpOnceAt" style="width:auto;padding:8px 10px">
          <span class="muted" style="font-size:12px">Broadcasts once at that time</span>
        </div>
        <div id="cfgDaily" class="hide row" style="gap:8px;align-items:center">
          <span class="muted" style="font-size:13px">Time of day</span>
          <input class="inp" type="time" id="inpDailyAt" style="width:auto;padding:8px 10px">
          <span class="muted" style="font-size:12px">Broadcasts every day at this time (repeatable)</span>
        </div>
      </div>
    </details>

    <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:12px">
      <label class="row" style="gap:6px;cursor:pointer">
        <input type="checkbox" id="chkVoice" checked style="width:16px;height:16px"> Voice
      </label>
      <div class="row" style="gap:6px">
        <span class="muted" style="font-size:13px">Pop-up color</span>
        <span class="swatches" id="swatches"></span>
      </div>
      <button class="btn btn-sm" data-ga="send_test" data-ga-pos="compose" onclick="sendTest()">🔊 Test</button>
      <button class="btn btn-pri btn-sm" id="btnSend" style="margin-left:auto;padding:10px 22px;font-size:15px" data-ga="send_click" data-ga-pos="compose" onclick="sendByMode()">Send to classroom 📢</button>
    </div>
  </div>

  <div class="card">
    <div class="spread" style="padding:14px 18px;border-bottom:1px solid var(--line)">
      <div style="font-weight:700;font-size:15px">⏰ Scheduled broadcasts</div>
      <button class="btn btn-sm" onclick="refreshJobs()">Refresh</button>
    </div>
    <div id="jobList"><div class="empty-state" style="padding:22px">Loading…</div></div>
  </div>

  <div class="card">
    <div class="spread" style="padding:14px 18px;border-bottom:1px solid var(--line)">
      <div style="font-weight:700;font-size:15px">Notice history <span class="muted" style="font-size:12px;font-weight:400">Only the latest 10 are kept</span></div>
      <button class="btn btn-sm" onclick="refreshNotifs()">Refresh</button>
    </div>
    <div id="notifList"><div class="empty-state" style="padding:30px">Loading…</div></div>
  </div>

  ${isOwner ? `
  <details class="fold">
    <summary>
      <span class="fold-t">👥 Co-teachers</span>
      <span class="fold-open">Expand ▾</span>
    </summary>
    <div class="fold-body">
      <p class="muted" style="margin:2px 0 10px;font-size:13px">The other teacher first registers a co-teacher account with a <b style="color:#374151">CO- code</b>. Then send them the invite code below — they enter it under “Join class” after signing in.</p>
      <div class="row" id="codeGenRow" style="gap:8px;margin-bottom:6px">
        <button class="btn btn-pri btn-sm" data-ga="invite_code_gen" data-ga-pos="co_manage" onclick="makeInviteCode()">🔑 Generate invite code</button>
      </div>
      <div id="codeRow" style="display:none;margin-bottom:6px">
        <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap">
          <span id="invCode" class="mono" style="font-size:22px;font-weight:800;letter-spacing:6px;padding:8px 16px;background:#f3f4f6;border:1px dashed var(--line);border-radius:10px"></span>
          <button class="btn btn-sm" data-ga="invite_code_copy" data-ga-pos="co_manage" onclick="copyInviteCode()">Copy</button>
          <button class="btn btn-sm btn-danger" data-ga="invite_code_revoke" data-ga-pos="co_manage" onclick="revokeInviteCode()">Revoke</button>
          <button class="btn btn-sm" data-ga="invite_code_regen" data-ga-pos="co_manage" onclick="makeInviteCode()">Regenerate</button>
        </div>
      </div>
      <p class="muted" style="font-size:12px;margin:0 0 10px" id="codeHint"></p>
      <div id="coList"></div>
    </div>
  </details>` : ''}
  `;

  // color swatches
  const sw = document.getElementById('swatches');
  sw.innerHTML = COLORS.map((cl) => `<span class="sw ${cl === msgColor ? 'on' : ''}" style="background:${cl}" data-c="${cl}" data-ga="pick_color" data-ga-pos="compose" onclick="pickColor(this,'${cl}')"></span>`).join('');
  if (isOwner && document.getElementById('coList')) loadCoManage();
}

async function refreshNotifs() {
  if (!curId) return;
  try {
    const { notifications } = await api('GET', `/api/classes/${curId}/notifications`);
    const list = document.getElementById('notifList');
    if (!list) return;
    if (!notifications.length) {
      list.innerHTML = '<div class="empty-state" style="padding:30px"><div>No notices sent yet</div><div class="muted" style="font-size:13px">Type a message above and click “Send to classroom”.</div></div>';
      return;
    }
    list.innerHTML = notifications.map((n) => `
      <div class="msg-item">
        <div class="msg-bar" style="background:${esc(n.color || '#e11d48')}"></div>
        <div class="grow" style="min-width:0">
          <div class="row" style="gap:8px;flex-wrap:wrap">
            <b>${esc(n.fromName)}</b>
            <span class="muted" style="font-size:12px">${fmtTime(n.createdAt)}</span>
            ${n.voice === false ? '<span class="badge">Muted</span>' : '<span class="badge badge-pri">🔊 Voice</span>'}
            ${n.schedule === 'daily' ? '<span class="badge badge-warn">Daily</span>' : (n.schedule === 'once' ? '<span class="badge badge-pri">Scheduled</span>' : '')}
            ${n.duration === -1 ? '<span class="badge badge-warn">Manual close</span>' : (n.duration ? '<span class="badge">Stay ' + fmtDuration(n.duration) + '</span>' : '')}
            ${n.delivered ? '<span class="badge badge-ok">Delivered</span>' : '<span class="badge badge-red">Classroom was offline</span>'}
          </div>
          <div style="margin-top:4px;word-break:break-word">${esc(n.content)}</div>
        </div>
      </div>`).join('');
  } catch (e) { toast(e.message, 'err'); }
}

/* ================= actions ================= */
async function doCreate() {
  const name = document.getElementById('newName').value.trim();
  if (!name) return toast('Please enter a class name', 'err');
  try {
    const { user } = await api('POST', '/api/classes', { name });
    toast('Class created', 'ok');
    ME = await api('GET', '/api/me');
    curId = ME.classes[ME.classes.length - 1].id;
    boot();
  } catch (e) { toast(e.message, 'err'); }
}

async function doDeleteClass() {
  if (!confirm('Delete class “' + cur.name + '”? Its notice history and co-teacher links will be removed too.')) return;
  try {
    await api('DELETE', `/api/classes/${curId}`);
    toast('Class deleted', 'ok');
    ME = await api('GET', '/api/me');
    curId = null; boot();
  } catch (e) { toast(e.message, 'err'); }
}

function toggleRename() {
  const box = document.getElementById('renameBox');
  const hidden = box.classList.contains('hide');
  box.classList.toggle('hide');
  if (!hidden) return;
  box.innerHTML = `<input class="inp grow" id="newNameX" value="${esc(cur.name)}" maxlength="20">
    <button class="btn btn-pri btn-sm" onclick="doRename()">Save</button>
    <button class="btn btn-sm" onclick="toggleRename()">Cancel</button>`;
  document.getElementById('newNameX').focus();
  document.getElementById('newNameX').select();
}

async function doRename() {
  const name = document.getElementById('newNameX').value.trim();
  if (!name) return toast('Name cannot be empty', 'err');
  try {
    await api('PATCH', `/api/classes/${curId}`, { name });
    toast('Renamed', 'ok');
    ME = await api('GET', '/api/me');
    cur = ME.classes.find((c) => c.id === curId);
    renderSide(); renderContent();
  } catch (e) { toast(e.message, 'err'); }
}

async function doLeave() {
  if (!confirm('Leave class “' + cur.name + '”?')) return;
  try {
    await api('DELETE', `/api/classes/${curId}/members/${ME.user.id}`);
    toast('You left the class', 'ok');
    ME = await api('GET', '/api/me');
    curId = null; boot();
  } catch (e) { toast(e.message, 'err'); }
}

async function copyBind() {
  const code = document.getElementById('bindCode').textContent.trim();
  toast((await copyText(code)) ? 'Bind code copied' : 'Please copy manually: ' + code, 'ok');
}
function pickColor(el, c) {
  msgColor = c;
  document.querySelectorAll('#swatches .sw').forEach((x) => x.classList.toggle('on', x === el));
}

function fmtDuration(s) {
  if (s === -1) return 'manual close';
  if (!s) return '';
  if (s < 60) return s + 's';
  if (s < 3600) {
    const m = Math.floor(s / 60);
    const r = s % 60;
    return r === 0 ? m + ' min' : m + ' min ' + r + ' s';
  }
  const h = Math.floor(s / 3600);
  const m = Math.round((s % 3600) / 60);
  return m === 0 ? h + ' hr' : h + ' hr ' + m + ' min';
}
function durVal() {
  const sel = document.getElementById('selDuration');
  if (!sel) return 0;
  const mode = sel.value;
  if (mode === '-1') return -1;
  const inp = document.getElementById('inpDurNum');
  if (!inp) return 0;
  let n = Math.floor(Number(inp.value));
  if (!Number.isFinite(n) || n < 1) { n = 1; inp.value = 1; } // empty or 0 → treat as 1 unit
  const sec = mode === 'hour' ? n * 3600 : n * 60;
  return Math.min(sec, 14400); // up to 4 hours
}
function onDurChange() {
  const sel = document.getElementById('selDuration');
  if (!sel) return;
  const mode = sel.value;
  const wrap = document.getElementById('durInputWrap');
  const unit = document.getElementById('durUnit');
  const tip = document.getElementById('durTip');
  if (wrap) wrap.classList.toggle('hide', mode === '-1');
  if (unit) unit.textContent = mode === 'hour' ? 'hr' : 'min';
  if (tip) tip.style.display = mode === '-1' ? '' : 'none';
}
function onModeChange() {
  const v = document.getElementById('selMode').value;
  document.getElementById('cfgOnce').classList.toggle('hide', v !== 'once');
  document.getElementById('cfgDaily').classList.toggle('hide', v !== 'daily');
  const b = document.getElementById('btnSend');
  b.textContent = v === 'now' ? 'Send to classroom 📢' : (v === 'daily' ? 'Start daily broadcast ⏰' : 'Schedule broadcast ⏰');
}
function sendByMode() {
  return document.getElementById('selMode').value === 'now' ? doSend() : doSchedule();
}

async function doSend() {
  const content = document.getElementById('txtContent').value.trim();
  if (!content) return toast('Please enter the notice content', 'err');
  try {
    const res = await api('POST', `/api/classes/${curId}/notify`, {
      content, voice: document.getElementById('chkVoice').checked, color: msgColor, duration: durVal(),
    });
    const n = res.notification;
    gaEvent('notify_sent', { mode: 'now', voice: document.getElementById('chkVoice').checked, long_stay: durVal() === -1 ? 1 : 0, delivered: n.delivered ? 1 : 0 });
    toast(n.delivered ? 'Sent — the classroom is broadcasting' : 'Sent, but the classroom is offline (it may not be broadcast)', n.delivered ? 'ok' : 'err');
    document.getElementById('txtContent').value = '';
    refreshNotifs();
  } catch (e) { toast(e.message, 'err'); }
}

async function doSchedule() {
  const content = document.getElementById('txtContent').value.trim();
  if (!content) return toast('Please enter the broadcast content', 'err');
  const v = document.getElementById('selMode').value;
  const common = { content, voice: document.getElementById('chkVoice').checked, color: msgColor, duration: durVal() };
  try {
    let msg;
    if (v === 'once') {
      const at = document.getElementById('inpOnceAt').value;
      if (!at) return toast('Please choose the date and time first', 'err');
      const res = await api('POST', `/api/classes/${curId}/jobs`, { ...common, type: 'once', runAt: new Date(at).toISOString() });
      msg = 'Scheduled — broadcasts at ' + fmtTime(res.job.runAt);
    } else {
      const tm = document.getElementById('inpDailyAt').value;
      if (!tm) return toast('Please choose the daily time first', 'err');
      const res = await api('POST', `/api/classes/${curId}/jobs`, { ...common, type: 'daily', time: tm });
      msg = 'Daily broadcast on — every day at ' + res.job.hm;
    }
    gaEvent('notify_scheduled', { mode: v, voice: document.getElementById('chkVoice').checked });
    toast(msg, 'ok');
    document.getElementById('txtContent').value = '';
    document.getElementById('selMode').value = 'now';
    onModeChange();
    refreshJobs();
  } catch (e) { toast(e.message, 'err'); }
}

async function refreshJobs() {
  if (!curId) return;
  try {
    const { jobs } = await api('GET', `/api/classes/${curId}/jobs`);
    const box = document.getElementById('jobList');
    if (!box) return;
    if (!jobs.length) { box.innerHTML = '<div class="empty-state" style="padding:22px">No scheduled broadcasts<br><span class="muted" style="font-size:13px">Open “On-screen duration / Scheduling” above to add one.</span></div>'; return; }
    box.innerHTML = jobs.map((j) => `
      <div class="msg-item">
        <div class="msg-bar" style="background:${esc(j.color || '#e11d48')}"></div>
        <div class="grow" style="min-width:0">
          <div class="row" style="gap:8px;flex-wrap:wrap">
            ${j.type === 'daily' ? '<span class="badge badge-warn">Daily ' + esc(j.hm) + '</span>' : '<span class="badge badge-pri">Once</span>'}
            <span class="muted" style="font-size:12px">Next: ${fmtTime(j.runAt)}</span>
            ${j.voice === false ? '<span class="badge">Muted</span>' : '<span class="badge badge-pri">🔊 Voice</span>'}
            ${j.duration ? '<span class="badge">Stay ' + fmtDuration(j.duration) + '</span>' : ''}
          </div>
          <div style="margin-top:4px;word-break:break-word">${esc(j.content)}</div>
        </div>
        <button class="btn btn-sm" data-ga="job_run_now" data-ga-pos="jobs" onclick="runJobNow('${j.id}')">Run now</button>
        <button class="btn btn-sm btn-danger" data-ga="job_cancel" data-ga-pos="jobs" onclick="cancelJob('${j.id}')">Cancel</button>
      </div>`).join('');
  } catch (e) { /* ignore */ }
}
async function cancelJob(id) {
  try {
    await api('DELETE', `/api/classes/${curId}/jobs/${id}`);
    toast('Scheduled broadcast cancelled', 'ok');
    refreshJobs();
  } catch (e) { toast(e.message, 'err'); }
}
async function runJobNow(id) {
  try {
    const r = await api('POST', `/api/classes/${curId}/jobs/${id}/run`);
    toast(r.delivered ? 'Broadcast now — the classroom is playing it' : 'Triggered, but the classroom is offline', r.delivered ? 'ok' : 'err');
    refreshJobs(); refreshNotifs();
  } catch (e) { toast(e.message, 'err'); }
}

async function sendTest() {
  try {
    const res = await api('POST', `/api/classes/${curId}/notify`, { content: 'Test broadcast: the notice system and sound are working properly.', voice: true, color: msgColor });
    gaEvent('notify_test', { delivered: res.notification.delivered ? 1 : 0 });
    toast(res.notification.delivered ? 'Test notice broadcast' : 'Classroom offline — test notice not delivered', res.notification.delivered ? 'ok' : 'err');
    refreshNotifs();
  } catch (e) { toast(e.message, 'err'); }
}

async function remoteMinimize() {
  try {
    await api('POST', `/api/classes/${curId}/minimize`);
    toast('Minimize command sent', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

function renderInviteCode(codeObj) {
  const genRow = document.getElementById('codeGenRow');
  const row = document.getElementById('codeRow');
  const codeEl = document.getElementById('invCode');
  const hint = document.getElementById('codeHint');
  if (!genRow || !row) return;
  if (codeObj && codeObj.code) {
    genRow.style.display = 'none';
    row.style.display = 'block';
    codeEl.textContent = codeObj.code;
    hint.textContent = 'Invite codes never expire and can be used by several people. “Revoke” or “Regenerate” invalidates the old one.';
  } else {
    genRow.style.display = 'flex';
    row.style.display = 'none';
    codeEl.textContent = '';
    hint.textContent = 'Generate an invite code and send it to a co-teacher.';
  }
}

async function revokeInviteCode() {
  if (!confirm('Revoke the current invite code? It stops working immediately; you can regenerate one any time.')) return;
  try {
    await api('DELETE', `/api/classes/${curId}/invite-code`);
    renderInviteCode(null);
    toast('Invite code revoked', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function loadCoManage() {
  const list = document.getElementById('coList');
  if (!list) return;
  try {
    const data = await api('GET', `/api/classes/${curId}/invites`);
    renderInviteCode(data.code);
    list.innerHTML = '<div class="muted" style="font-size:13px;margin-bottom:6px">Co-teachers joined:</div>' +
      (data.members.length ? data.members.map((m) => `
        <div class="row spread" style="padding:6px 0">
          <span><b>${esc(m.username)}</b> <span class="badge badge-warn">Co-teacher</span></span>
          <button class="btn btn-sm btn-danger" data-ga="member_remove" data-ga-pos="co_manage" onclick="removeMember('${m.id}')">Remove</button>
        </div>`).join('') : '<div class="muted" style="font-size:13px">None yet. Send the invite code above to a co-teacher.</div>');
  } catch (e) { /* ignore */ }
}

async function makeInviteCode() {
  try {
    const r = await api('POST', `/api/classes/${curId}/invite-code`);
    renderInviteCode(r);
    toast('Invite code generated', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function copyInviteCode() {
  const v = (document.getElementById('invCode').textContent || '').trim();
  if (!v) return toast('Please generate an invite code first', 'err');
  toast((await copyText(v)) ? 'Invite code copied' : 'Please copy manually', 'ok');
}

/* co-teacher: join a class with an invite code */
function renderJoinBox() {
  const box = document.getElementById('joinBox');
  if (!box) return;
  if (ME.user.type !== 'co') { box.innerHTML = ''; return; }
  box.innerHTML = `
    <div class="card" style="padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="badge badge-pri" style="font-size:13px">🔑 Join class</span>
      <input class="inp grow" id="joinCode" placeholder="Enter the invite code from the class owner" maxlength="12" style="text-transform:uppercase;letter-spacing:2px">
      <button class="btn btn-pri btn-sm" data-ga="join_by_code" data-ga-pos="join_box" onclick="joinByCode()">Join</button>
    </div>`;
}

async function joinByCode() {
  const el = document.getElementById('joinCode');
  if (!el) return;
  const code = (el.value || '').trim().toUpperCase();
  if (!code) return toast('Please enter the invite code', 'err');
  try {
    const r = await api('POST', '/api/invite-code/accept', { code });
    toast(r.already ? 'You are already in this class' : 'Joined class "' + (r.className || '') + '"', 'ok');
    ME = await api('GET', '/api/me');
    curId = null;
    boot();
  } catch (e) { toast(e.message, 'err'); }
}

async function removeMember(uid) {
  if (!confirm('Remove this teacher from the class?')) return;
  try {
    await api('DELETE', `/api/classes/${curId}/members/${uid}`);
    toast('Removed', 'ok');
    ME = await api('GET', '/api/me');
    cur = ME.classes.find((c) => c.id === curId);
    loadCoManage();
  } catch (e) { toast(e.message, 'err'); }
}

async function handleInvite(id, act) {
  try {
    await api('POST', `/api/invites/${id}/${act}`);
    toast(act === 'accept' ? 'Invitation accepted' : 'Declined', 'ok');
    ME = await api('GET', '/api/me');
    renderInvites();
    curId = null; boot();
  } catch (e) { toast(e.message, 'err'); }
}

async function doLogout() {
  const isTrial = !!(ME.user && ME.user.trial);
  try { await api('POST', '/api/auth/logout'); } catch (e) {}
  location.href = isTrial ? '/en/' : '/en/login';
}

/* ================= classroom presence polling ================= */
function applyPresence() {
  ME.classes.forEach((c) => {
    document.querySelectorAll(`[data-cid="${c.id}"]`).forEach((el) => {
      const d = el.querySelector('.dot');
      const st = el.querySelector('.st');
      if (!d) return;
      d.classList.toggle('on', c.online);
      d.classList.toggle('off', !c.online);
      if (st) st.textContent = c.online ? 'Classroom online' : 'Classroom offline';
    });
  });
}

async function pollPresence() {
  if (!ME) return;
  try {
    const me = await api('GET', '/api/me');
    me.classes.forEach((nc) => {
      const old = ME.classes.find((x) => x.id === nc.id);
      if (old) old.online = nc.online;
    });
    applyPresence();
  } catch (e) { /* ignore */ }
}

/* ================= start ================= */
(async function init() {
  try {
    ME = await api('GET', '/api/me');
    window.GA_CTX = { trial: ME.user.trial ? 1 : 0, acct: ME.user.type };   // so every event carries the account type
    boot();
    renderTrial();
    setInterval(pollPresence, 6000);
    // refresh the co-teacher list once content is rendered
    setInterval(() => { if (cur && cur.isOwner && document.getElementById('coList')) loadCoManage(); }, 10000);
    // auto-refresh scheduled broadcasts (so finished ones disappear promptly)
    setInterval(() => { if (document.getElementById('jobList')) refreshJobs(); }, 10000);
  } catch (e) {
    if (e.message !== 'Not signed in') toast(e.message, 'err');
  }
})();
</script>
