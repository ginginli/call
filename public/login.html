<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 · 班级喊话系统</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="language-list floating">
  <a class="curr" href="/login" title="中文">中文</a>
  <a href="/en/login" title="English">English</a>
</div>
<div class="auth-bg">
  <div class="auth-box">
    <a class="back-home" href="/">← 返回首页</a>
    <div class="brand">
      <div class="logo">📢</div>
      <div>
        <h1>班级喊话系统</h1>
        <p>网页发通知 · 教室自动全屏播报</p>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <button id="tabLogin" class="on" onclick="showTab('login')">登录</button>
        <button id="tabReg" onclick="showTab('reg')">注册账号</button>
        <button id="tabForgot" onclick="showTab('forgot')">忘记密码</button>
      </div>

      <!-- 登录 -->
      <form class="auth-pane" id="paneLogin" onsubmit="return doLogin(event)">
        <h2>登录后台</h2>
        <label class="lbl">用户名</label>
        <input class="inp" id="liUser" autocomplete="username" required>
        <label class="lbl">密码</label>
        <input class="inp" id="liPass" type="password" autocomplete="current-password" required>
        <div style="height:18px"></div>
        <button class="btn btn-pri btn-block" type="submit">登 录</button>
      </form>

      <!-- 注册 -->
      <form class="auth-pane hide" id="paneReg" onsubmit="return doReg(event)">
        <h2>注册账号</h2>
        <p class="sub">第一次使用需激活卡号，注册成功自动进入后台</p>
        <label class="lbl">激活卡号</label>
        <input class="inp mono" id="rgCard" placeholder="例如 OWN-XXXX-XXXX" style="letter-spacing:1px">
        <label class="lbl">登录用户名（请牢记，找回密码需用到）</label>
        <input class="inp" id="rgUser" maxlength="20" required>
        <label class="lbl">密码(至少 6 位)</label>
        <input class="inp" id="rgPass" type="password" required>
        <label class="lbl">确认密码</label>
        <input class="inp" id="rgPass2" type="password" required>
        <label class="lbl">班级邀请码（选填 · 协同老师填写）</label>
        <input class="inp mono" id="rgInvite" placeholder="班主任给你的邀请码" maxlength="12" style="text-transform:uppercase;letter-spacing:2px">
        <div style="height:18px"></div>
        <button class="btn btn-pri btn-block" type="submit">立即注册</button>
        <p class="sub" style="margin:12px 0 0;line-height:1.6" id="rgTip">普通激活卡注册后自带 2 个班级；协同授权码（CO- 开头）注册的是协同账号，不能新建班级</p>

        <!-- 申请激活卡号 -->
        <div class="req-box" id="reqBox">
          <div class="req-h">还没有激活卡号？</div>
          <p class="req-p">
            填写你的联系邮箱提交申请，我们会尽快把激活卡号发给你；也可以直接把申请发到邮箱
            <b class="mono" id="reqMail">ladyiney25@gmail.com</b>
            <button class="btn btn-sm" type="button" onclick="copyReqMail()">复制</button>
          </p>
          <input class="inp" id="reqContact" type="email" placeholder="你的联系邮箱，例如 teacher@example.com"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();submitCardRequest();}">
          <textarea class="inp" id="reqNote" rows="2" maxlength="200" placeholder="想说明的情况（选填，如：任教年级、班级数量）"
                    style="margin-top:8px" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitCardRequest();}"></textarea>
          <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap">
            <button class="btn btn-pri btn-sm" type="button" id="reqBtn" onclick="submitCardRequest()">提交申请</button>
            <button class="btn btn-sm" type="button" onclick="mailtoCardRequest()">📧 用邮箱发送申请</button>
          </div>
        </div>
      </form>

      <!-- 忘记密码 -->
      <form class="auth-pane hide" id="paneForgot" onsubmit="return doForgot(event)">
        <h2>找回密码</h2>
        <p class="sub">输入用户名 + 注册时使用的激活卡号</p>
        <label class="lbl">用户名</label>
        <input class="inp" id="foUser" required>
        <label class="lbl">激活卡号</label>
        <input class="inp mono" id="foCard" placeholder="例如 OWN-XXXX-XXXX">
        <label class="lbl">新密码(至少 6 位)</label>
        <input class="inp" id="foPass" type="password" required>
        <div style="height:18px"></div>
        <button class="btn btn-pri btn-block" type="submit">重置密码</button>
        <p class="sub" style="margin:12px 0 0;line-height:1.6">卡号也忘了？发邮件到 <b>ladyiney25@gmail.com</b> 说明情况，我们帮你找回。</p>
      </form>
    </div>
  </div>
</div>

<script src="/common.js"></script>
<script>
const REQ_EMAIL = 'ladyiney25@gmail.com';

function showTab(t) {
  ['login', 'reg', 'forgot'].forEach((k) => {
    document.getElementById('pane' + k[0].toUpperCase() + k.slice(1)).classList.toggle('hide', k !== t);
    document.getElementById('tab' + k[0].toUpperCase() + k.slice(1)).classList.toggle('on', k === t);
  });
}

async function doLogin(e) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  try {
    await api('POST', '/api/auth/login', { username: liUser.value.trim(), password: liPass.value });
    location.href = '/app';
  } catch (err) {
    toast(err.message, 'err'); btn.disabled = false;
  }
}

async function doReg(e) {
  e.preventDefault();
  if (rgPass.value.length < 6) return toast('密码至少 6 位', 'err');
  if (rgPass.value !== rgPass2.value) return toast('两次输入的密码不一致', 'err');
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  try {
    await api('POST', '/api/auth/register', {
      username: rgUser.value.trim(), password: rgPass.value, cardCode: rgCard.value.trim(),
    });
    await joinByInviteCode((rgInvite.value || '').trim().toUpperCase());
    location.href = '/app';
  } catch (err) {
    toast(err.message, 'err'); btn.disabled = false;
  }
}

/* 注册时填了邀请码 → 自动加入对应班级 */
async function joinByInviteCode(code) {
  if (!code) return;
  try {
    const r = await api('POST', '/api/invite-code/accept', { code });
    toast(r.already ? '你已在该班级中' : '已加入班级「' + (r.className || '') + '」', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function doForgot(e) {
  e.preventDefault();
  if (foPass.value.length < 6) return toast('新密码至少 6 位', 'err');
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  try {
    await api('POST', '/api/auth/forgot', { username: foUser.value.trim(), cardCode: foCard.value.trim(), password: foPass.value });
    toast('密码已重置, 请重新登录', 'ok');
    showTab('login');
  } catch (err) {
    toast(err.message, 'err');
  } finally { btn.disabled = false; }
}

/* ---------- 申请激活卡号 ---------- */
function reqPayload() {
  return {
    contact: (document.getElementById('reqContact').value || '').trim(),
    note: (document.getElementById('reqNote').value || '').trim(),
    lang: 'zh',
  };
}

async function submitCardRequest() {
  const p = reqPayload();
  if (p.contact.length < 3) return toast('请先填写联系邮箱', 'err');
  const btn = document.getElementById('reqBtn');
  btn.disabled = true;
  try {
    await api('POST', '/api/card-request', p);
    toast('申请已提交，我们会在 1 个工作日内联系你', 'ok');
    toast('也可直接发邮件到 ' + REQ_EMAIL, 'ok');
    document.getElementById('reqNote').value = '';
  } catch (err) {
    toast(err.message, 'err');
  } finally { btn.disabled = false; }
}

function mailtoCardRequest() {
  const p = reqPayload();
  const subject = '申请激活卡号（班级喊话系统）';
  const body = [
    '你好，我想申请班级喊话系统的激活卡号。',
    '',
    '联系邮箱：' + (p.contact || '（请填写）'),
    '补充说明：' + (p.note || '（无）'),
  ].join('\n');
  location.href = 'mailto:' + REQ_EMAIL
    + '?subject=' + encodeURIComponent(subject)
    + '&body=' + encodeURIComponent(body);
}

async function copyReqMail() {
  const ok = await copyText(REQ_EMAIL);
  toast(ok ? '邮箱已复制：' + REQ_EMAIL : '请手动复制：' + REQ_EMAIL, ok ? 'ok' : 'err');
}

/* 从落地页带 #reg / #card 进来时直接定位到对应位置 */
(function applyHash() {
  const h = (location.hash || '').toLowerCase();
  if (h !== '#reg' && h !== '#card') return;
  showTab('reg');
  if (h === '#card') {
    setTimeout(() => {
      const box = document.getElementById('reqBox');
      if (!box) return;
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      box.classList.add('hl');
    }, 120);
  }
})();
</script>
</body>
</html>
