<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>班級喊話系統 · 後台</title>
<link rel="stylesheet" href="/style.css">
<style>
  details.fold{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
  details.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 16px;font-size:14px;color:var(--text)}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold .fold-t{font-weight:700;font-size:15px}
  details.fold .fold-open{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
  details.fold .fold-body{padding:0 16px 14px}
  details.fold[open]>summary{border-bottom:1px solid var(--line)}
  /* 體驗帳號引導條 */
  .trial-bar{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;border:1px solid #ddd6fe;border-radius:14px;background:linear-gradient(135deg,#f5f3ff,#eef2ff);padding:16px 18px}
  .trial-main{flex:1;min-width:260px}
  .trial-h{font-weight:800;font-size:15px;color:#4338ca;margin-bottom:6px}
  .trial-p{font-size:13px;color:#4b5563;line-height:1.7;margin-bottom:12px}
  .trial-steps{display:flex;gap:10px;flex-wrap:wrap}
  .trial-step{flex:1;min-width:165px;text-align:left;background:#fff;border:1px solid #e0e7ff;border-radius:11px;padding:11px 13px;font:inherit;transition:.15s}
  .trial-step.go{cursor:pointer;border-color:#c7d2fe}
  .trial-step.go:hover{border-color:#818cf8;box-shadow:0 6px 16px rgba(79,70,229,.14)}
  .trial-step b{display:block;font-size:13.5px;color:#312e81;margin-bottom:3px}
  .trial-step span{font-size:12px;color:#6b7280;line-height:1.5}
  .trial-cta{text-align:right}
  .trial-note{font-size:11.5px;color:#9ca3af;margin-top:8px}
</style>
</head>
<body>

<header class="topbar">
  <a class="mini-logo" href="/zh-Hant/" title="返回首頁">
    <div class="logo">📢</div>
    <span>班級喊話系統</span>
  </a>
  <div class="row" style="gap:10px">
    <span class="badge badge-pri" id="uType"></span>
    <span class="muted" id="uQuota"></span>
    <span style="font-weight:600" id="uName"></span>
    <select class="lang-select" title="切換語言" aria-label="切換語言" onchange="if(this.value)location.href=this.value">
      <option value="/app">简体</option>
      <option value="/zh-Hant/app" selected>繁體</option>
      <option value="/en/app">English</option>
    </select>
    <button class="btn btn-sm btn-danger" id="btnLogout" onclick="doLogout()" data-ga="logout" data-ga-pos="topbar">登出</button>
  </div>

</header>

<div id="inviteBox" style="max-width:1240px;margin:14px auto 0;padding:0 18px"></div>
<div id="joinBox" style="max-width:1240px;margin:10px auto 0;padding:0 18px"></div>
<div id="trialBox" style="max-width:1240px;margin:10px auto 0;padding:0 18px"></div>

<main class="layout">
  <aside class="side">
    <div class="spread">
      <div class="muted" style="font-weight:600">我的班級</div>
      <div class="row">
        <span class="badge" id="sideCount">0</span>
      </div>
    </div>
    <div id="classList" class="side-scroll" style="flex-direction:column"></div>

    <div id="createWrap" style="display:flex;gap:8px;flex-direction:column"></div>
    <div class="muted" id="quotaTip" style="font-size:12px"></div>
  </aside>

  <section class="content" id="content">
    <div class="card empty-state" id="emptyBox" style="display:none">
      <div class="big">🗂️</div>
      <h3 id="emptyTitle">暫無班級</h3>
      <p id="emptyDesc"></p>
    </div>
    <div id="contentBody" style="display:flex;flex-direction:column;gap:16px"></div>
  </section>
</main>

<script src="/socket.io/socket.io.js"></script>
<script src="/zh-Hant/common.js"></script>
<script>
const COLORS = ['#e11d48', '#2563eb', '#16a34a', '#f59e0b', '#9333ea'];
let ME = null;          // /api/me 回傳的資料
let curId = null;       // 目前選取的班級 id
let cur = null;         // 目前班級物件副本
let msgColor = COLORS[0];

/* ================= 體驗帳號引導(僅體驗帳號可見) ================= */
function renderTrial() {
  const box = document.getElementById('trialBox');
  const u = ME.user;
  if (!u.trial) { box.innerHTML = ''; return; }
  const cls = ME.classes.find((c) => c.isOwner);
  const code = (cls && cls.bindCode) || '';
  box.innerHTML = `
    <div class="trial-bar">
      <div class="trial-main">
        <div class="trial-h">🧪 體驗模式：你正在使用臨時體驗帳號「${esc(u.username)}」</div>
        <div class="trial-p">這不是正式帳號，<b>24 小時後連同資料一起自動清空</b>（功能是真的，只是留不住）。走完下面 3 步，就能看到「老師在辦公室發一句 → 教室大屏立刻全螢幕彈出並語音播報」的完整過程。</div>
        <div class="trial-steps">
          <button type="button" class="trial-step go" data-ga="open_room" data-ga-pos="trial_bar" onclick="trialOpenRoom('${esc(code)}')">
            <b>① 開啟教室屏</b>
            <span>點這裡新開一個視窗，綁定碼 ${esc(code)} 已自動填好</span>
          </button>
          <div class="trial-step">
            <b>② 回來發一則通知</b>
            <span>在右側輸入框寫一句話，點「發送通知」</span>
          </div>
          <div class="trial-step">
            <b>③ 看教室屏彈窗</b>
            <span>另一個視窗會全螢幕彈出，並把這句話唸出來</span>
          </div>
        </div>
      </div>
      <div class="trial-cta">
        <a class="btn btn-pri" href="/zh-Hant/#card" data-ga="apply_full_access" data-ga-pos="trial_bar">免費申請正式使用</a>
        <div class="trial-note">體驗帳號僅作示範，24 小時後自動清空 · <a href="/zh-Hant/" data-ga="back_home" data-ga-pos="trial_bar">返回首頁</a></div>
      </div>
    </div>`;
}

function trialOpenRoom(code) {
  window.open('/zh-Hant/room' + (code ? '?code=' + encodeURIComponent(code) : ''), '_blank');
  toast('教室屏已在新視窗開啟：把它拖到另一塊螢幕，或縮小後和本頁並排，就能看到彈窗');
}

/* ================= 基礎渲染 ================= */
function boot() {
  renderTop();
  renderSide();
  renderInvites();
  renderJoinBox();
  renderQuotaTip();
  curId = curId && ME.classes.some((c) => c.id === curId) ? curId : (ME.classes[0] ? ME.classes[0].id : null);
  if (curId) selectClass(curId);
  else showEmpty();
}

function renderTop() {
  const u = ME.user;
  document.getElementById('uName').textContent = u.username;
  document.getElementById('uType').textContent = u.trial ? '體驗帳號' : (u.type === 'co' ? '協同帳號' : '主帳號');
  document.getElementById('uType').className = 'badge ' + ((u.trial || u.type === 'co') ? 'badge-warn' : 'badge-pri');
  document.getElementById('uQuota').textContent = u.type === 'owner'
    ? ('已建立 ' + (u.ownedCount || 0) + ' / ' + (u.classLimit || 0) + ' 個班級') : '';
  const lo = document.getElementById('btnLogout');
  if (lo) lo.textContent = u.trial ? '退出體驗' : '登出';
}

function renderSide() {
  const box = document.getElementById('classList');
  const owned = ME.classes.filter((c) => c.isOwner);
  const shared = ME.classes.filter((c) => !c.isOwner);
  const item = (c) => `
    <div class="class-item ${c.id === curId ? 'on' : ''}" data-ga="switch_class" data-ga-pos="sidebar" onclick="selectClass('${c.id}')">
      <span class="dot ${c.online ? 'on' : 'off'}"></span>
      <div class="grow" style="min-width:0">
        <div class="cname">${esc(c.name)}</div>
        <div class="tag">${c.isOwner ? '我建立' : '協同·' + esc(c.ownerName || '')}</div>
      </div>
      ${!c.isOwner ? '' : (c.pendingInvites ? `<span class="badge badge-warn">邀${c.pendingInvites}</span>` : '')}
    </div>`;
  let html = owned.map(item).join('') + (owned.length && shared.length ? '<div class="muted" style="padding:6px 4px;font-size:12px">加入的班級</div>' : '') + shared.map(item).join('');
  if (!ME.classes.length) html = '<div class="muted" style="padding:10px;font-size:13px;text-align:center">還沒有班級</div>';
  box.innerHTML = html;
  document.getElementById('sideCount').textContent = ME.classes.length;

  const wrap = document.getElementById('createWrap');
  if (ME.user.type === 'owner') {
    wrap.innerHTML = `
      <div style="display:flex;gap:8px">
        <input class="inp grow" id="newName" maxlength="20" placeholder="輸入新班級名稱，如 三年二班">
        <button class="btn btn-pri" data-ga="create_class" data-ga-pos="sidebar" onclick="doCreate()">建立</button>
      </div>`;
  } else wrap.innerHTML = '';
}

function renderQuotaTip() {
  const t = document.getElementById('quotaTip');
  if (ME.user.type === 'co') t.textContent = '協同帳號輸入班主任給的邀請碼即可加入班級，隨後可發通知。';
  else t.innerHTML = '一個主帳號自帶 2 個班級；需要更多請聯絡客服。';
}

function showEmpty() {
  const eb = document.getElementById('emptyBox');
  eb.style.display = 'block';
  const isCo = ME.user.type === 'co';
  document.getElementById('emptyTitle').textContent = isCo ? '暫無加入的班級' : '還沒有班級';
  document.getElementById('emptyDesc').textContent = isCo
    ? '在上方「加入班級」處輸入班主任給你的邀請碼，即可加入並發送通知。'
    : '在上方輸入班級名稱點「建立」，即可取得該班級的綁定碼。';
  const body = document.getElementById('contentBody');
  if (body) body.innerHTML = '';
}

/* ================= 邀請橫幅 ================= */
function renderInvites() {
  const box = document.getElementById('inviteBox');
  if (!ME.invites.length) { box.innerHTML = ''; return; }
  box.innerHTML = ME.invites.map((iv) => `
    <div class="card" style="padding:12px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="badge badge-warn" style="font-size:13px">📨 收到邀請</span>
      <div class="grow">
        <b>${esc(iv.ownerName)}</b> 邀請你加入班級 <b>${esc(iv.className)}</b>，接受後即可發送通知
      </div>
      <button class="btn btn-pri btn-sm" data-ga="invite_accept" data-ga-pos="invite_banner" onclick="handleInvite('${iv.id}','accept')">接受</button>
      <button class="btn btn-sm" data-ga="invite_reject" data-ga-pos="invite_banner" onclick="handleInvite('${iv.id}','reject')">拒絕</button>
    </div>`).join('');
}

/* ================= 班級內容 ================= */
async function selectClass(id) {
  curId = id;
  cur = ME.classes.find((c) => c.id === id);
  if (!cur) return;
  document.getElementById('emptyBox').style.display = 'none';
  msgColor = cur.color || COLORS[0];
  renderSide();
  renderContent();
  refreshNotifs();
  refreshJobs();
}

function renderContent() {
  const c = cur;
  const isOwner = c.isOwner;
  const box = document.getElementById('contentBody');
  const u = ME.user;
  box.innerHTML = `
  <div class="card" style="padding:16px 18px;order:-2" id="clsPane">
    <div class="spread" style="flex-wrap:wrap;gap:10px">
      <div class="row" style="gap:12px;min-width:0">
        <h2 style="margin:0;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="clsName">${esc(c.name)}</h2>
        ${c.isOwner ? '<span class="badge badge-pri">我的班級</span>' : '<span class="badge badge-warn">協同管理</span>'}
        <span class="dotbox" data-cid="${c.id}" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)">
          <span class="dot ${c.online ? 'on' : 'off'}"></span><span class="st">${c.online ? '教室線上' : '教室離線'}</span>
        </span>
      </div>
      <div class="row" style="flex-wrap:wrap;gap:8px;align-items:center">
        ${isOwner ? `
        <span class="muted" style="font-size:13px">綁定碼</span>
        <code id="bindCode" class="mono" style="font-size:15px;background:#f3f4fb;padding:4px 10px;border-radius:6px;color:#1e2434">${esc(c.bindCode || '')}</code>
        <button class="btn btn-sm" data-ga="copy_bind" data-ga-pos="class_head" onclick="copyBind()">複製</button>` : ''}
        <button class="btn btn-sm" data-ga="remote_minimize" data-ga-pos="class_head" onclick="remoteMinimize()">📥 最小化通知螢幕</button>
        ${isOwner ? `
          <button class="btn btn-sm" data-ga="rename_class" data-ga-pos="class_head" onclick="toggleRename()" id="btnRename">✎ 重新命名</button>
          <button class="btn btn-sm btn-danger" data-ga="delete_class" data-ga-pos="class_head" onclick="doDeleteClass()">刪除班級</button>` : `
          <button class="btn btn-sm btn-danger" data-ga="leave_class" data-ga-pos="class_head" onclick="doLeave()">退出該班級</button>`}
      </div>
    </div>
    <div id="renameBox" class="hide" style="margin-top:10px;display:flex;gap:8px"></div>
  </div>

  ${isOwner ? '' : `
  <div class="card" style="padding:14px 18px;font-size:13px;color:var(--muted)">
    你是 <b style="color:#374151">${esc(u.username)}</b>（協同老師），由 <b style="color:#374151">${esc(c.ownerName || '')}</b> 邀請加入本班，可直接發送通知。
  </div>`}

  <div class="card" style="padding:16px 18px;order:-1">
    <div style="font-weight:700;font-size:15px;margin-bottom:10px">發送通知</div>
    <textarea class="inp" id="txtContent" rows="3" maxlength="500" placeholder="輸入要播報的內容，如：請三年二班全體同學馬上到操場集合。"></textarea>

    <details class="fold" style="margin-top:10px" open>
      <summary>
        <span class="fold-t">⚙️ 停留時長 / 定時喊話</span>
        <span class="fold-open">展開 ▾</span>
      </summary>
      <div class="fold-body">
        <div class="row" style="gap:14px;flex-wrap:wrap;align-items:center;padding:8px 0">
          <label class="row" style="gap:6px;align-items:center">
            <span class="muted" style="font-size:13px">教室彈出視窗停留</span>
            <select class="sel" id="selDuration" style="width:auto" onchange="onDurChange()">
              <option value="min">依分鐘</option>
              <option value="hour">依小時</option>
              <option value="-1" selected>一直顯示，需手動關閉</option>
            </select>
            <span id="durInputWrap" class="row hide" style="gap:6px;align-items:center">
              <input class="inp" id="inpDurNum" type="number" min="1" value="5" style="width:70px;padding:8px 10px">
              <span id="durUnit" class="muted" style="font-size:13px">分鐘</span>
            </span>
          </label>
          <label class="row" style="gap:6px">
            <span class="muted" style="font-size:13px">發送方式</span>
            <select class="sel" id="selMode" style="width:auto" onchange="onModeChange()">
              <option value="now">立即發送</option>
              <option value="once">定時發送(指定日期時間)</option>
              <option value="daily">每天固定時間</option>
            </select>
          </label>
        </div>
        <div class="muted" id="durTip" style="font-size:12px;padding:0 0 6px;display:none">選「一直顯示」時，教室螢幕會一直顯示這則通知，直到有人在教室點【最小化待命】，或你點上方「📥 最小化通知螢幕」遠端關掉。</div>
        <div id="cfgOnce" class="hide row" style="gap:8px;align-items:center">
          <span class="muted" style="font-size:13px">發送時刻</span>
          <input class="inp" type="datetime-local" id="inpOnceAt" style="width:auto;padding:8px 10px">
          <span class="muted" style="font-size:12px">到時自動播報一次</span>
        </div>
        <div id="cfgDaily" class="hide row" style="gap:8px;align-items:center">
          <span class="muted" style="font-size:13px">每天時刻</span>
          <input class="inp" type="time" id="inpDailyAt" style="width:auto;padding:8px 10px">
          <span class="muted" style="font-size:12px">每天這個時間自動播報(可重複)</span>
        </div>
      </div>
    </details>

    <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:12px">
      <label class="row" style="gap:6px;cursor:pointer">
        <input type="checkbox" id="chkVoice" checked style="width:16px;height:16px"> 語音播報
      </label>
      <div class="row" style="gap:6px">
        <span class="muted" style="font-size:13px">彈出視窗顏色</span>
        <span class="swatches" id="swatches"></span>
      </div>
      <button class="btn btn-sm" data-ga="send_test" data-ga-pos="compose" onclick="sendTest()">🔊 測試</button>
      <button class="btn btn-pri btn-sm" id="btnSend" style="margin-left:auto;padding:10px 22px;font-size:15px" data-ga="send_click" data-ga-pos="compose" onclick="sendByMode()">發送到教室 📢</button>
    </div>
  </div>

  <div class="card">
    <div class="spread" style="padding:14px 18px;border-bottom:1px solid var(--line)">
      <div style="font-weight:700;font-size:15px">⏰ 定時喊話</div>
      <button class="btn btn-sm" onclick="refreshJobs()">重新整理</button>
    </div>
    <div id="jobList"><div class="empty-state" style="padding:22px">載入中…</div></div>
  </div>

  <div class="card">
    <div class="spread" style="padding:14px 18px;border-bottom:1px solid var(--line)">
      <div style="font-weight:700;font-size:15px">通知記錄 <span class="muted" style="font-size:12px;font-weight:400">僅保留最近 10 筆記錄</span></div>
      <button class="btn btn-sm" onclick="refreshNotifs()">重新整理</button>
    </div>
    <div id="notifList"><div class="empty-state" style="padding:30px">載入中…</div></div>
  </div>

  ${isOwner ? `
  <details class="fold">
    <summary>
      <span class="fold-t">👥 協同老師</span>
      <span class="fold-open">展開 ▾</span>
    </summary>
    <div class="fold-body">
      <p class="muted" style="margin:2px 0 10px;font-size:13px">對方先用 <b style="color:#374151">CO- 開頭協同授權碼</b> 註冊協同帳號；把下方邀請碼發給對方，登入後在「加入班級」處輸入即可加入本班。</p>
      <div class="row" id="codeGenRow" style="gap:8px;margin-bottom:6px">
        <button class="btn btn-pri btn-sm" data-ga="invite_code_gen" data-ga-pos="co_manage" onclick="makeInviteCode()">🔑 產生邀請碼</button>
      </div>
      <div id="codeRow" style="display:none;margin-bottom:6px">
        <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap">
          <span id="invCode" class="mono" style="font-size:22px;font-weight:800;letter-spacing:6px;padding:8px 16px;background:#f3f4f6;border:1px dashed var(--line);border-radius:10px"></span>
          <button class="btn btn-sm" data-ga="invite_code_copy" data-ga-pos="co_manage" onclick="copyInviteCode()">複製</button>
          <button class="btn btn-sm btn-danger" data-ga="invite_code_revoke" data-ga-pos="co_manage" onclick="revokeInviteCode()">作廢</button>
          <button class="btn btn-sm" data-ga="invite_code_regen" data-ga-pos="co_manage" onclick="makeInviteCode()">重新產生</button>
        </div>
      </div>
      <p class="muted" style="font-size:12px;margin:0 0 10px" id="codeHint"></p>
      <div id="coList"></div>
    </div>
  </details>` : ''}
  `;

  // 色板
  const sw = document.getElementById('swatches');
  sw.innerHTML = COLORS.map((cl) => `<span class="sw ${cl === msgColor ? 'on' : ''}" style="background:${cl}" data-c="${cl}" data-ga="pick_color" data-ga-pos="compose" onclick="pickColor(this,'${cl}')"></span>`).join('');
  if (isOwner && document.getElementById('coList')) loadCoManage();
}

async function refreshNotifs() {
  if (!curId) return;
  try {
    const { notifications } = await api('GET', `/api/classes/${curId}/notifications`);
    const list = document.getElementById('notifList');
    if (!list) return;
    if (!notifications.length) {
      list.innerHTML = '<div class="empty-state" style="padding:30px"><div>還沒有發送過通知</div><div class="muted" style="font-size:13px">在上方輸入內容點「發送到教室」試試</div></div>';
      return;
    }
    list.innerHTML = notifications.map((n) => `
      <div class="msg-item">
        <div class="msg-bar" style="background:${esc(n.color || '#e11d48')}"></div>
        <div class="grow" style="min-width:0">
          <div class="row" style="gap:8px;flex-wrap:wrap">
            <b>${esc(n.fromName)}</b>
            <span class="muted" style="font-size:12px">${fmtTime(n.createdAt)}</span>
            ${n.voice === false ? '<span class="badge">靜音</span>' : '<span class="badge badge-pri">🔊 播報</span>'}
            ${n.schedule === 'daily' ? '<span class="badge badge-warn">每日定時</span>' : (n.schedule === 'once' ? '<span class="badge badge-pri">定時</span>' : '')}
            ${n.duration === -1 ? '<span class="badge badge-warn">需手動關閉</span>' : (n.duration ? '<span class="badge">停留' + fmtDuration(n.duration) + '</span>' : '')}
            ${n.delivered ? '<span class="badge badge-ok">已送達教室</span>' : '<span class="badge badge-red">發送時教室離線</span>'}
          </div>
          <div style="margin-top:4px;word-break:break-word">${esc(n.content)}</div>
        </div>
      </div>`).join('');
  } catch (e) { toast(e.message, 'err'); }
}

/* ================= 操作 ================= */
async function doCreate() {
  const name = document.getElementById('newName').value.trim();
  if (!name) return toast('請輸入班級名稱', 'err');
  try {
    const { user } = await api('POST', '/api/classes', { name });
    toast('班級建立成功', 'ok');
    ME = await api('GET', '/api/me');
    curId = ME.classes[ME.classes.length - 1].id;
    boot();
  } catch (e) { toast(e.message, 'err'); }
}

async function doDeleteClass() {
  if (!confirm('確認刪除班級「' + cur.name + '」？將同時清空其通知記錄與協同關係。')) return;
  try {
    await api('DELETE', `/api/classes/${curId}`);
    toast('班級已刪除', 'ok');
    ME = await api('GET', '/api/me');
    curId = null; boot();
  } catch (e) { toast(e.message, 'err'); }
}

function toggleRename() {
  const box = document.getElementById('renameBox');
  const hidden = box.classList.contains('hide');
  box.classList.toggle('hide');
  if (!hidden) return;
  box.innerHTML = `<input class="inp grow" id="newNameX" value="${esc(cur.name)}" maxlength="20">
    <button class="btn btn-pri btn-sm" onclick="doRename()">儲存</button>
    <button class="btn btn-sm" onclick="toggleRename()">取消</button>`;

  document.getElementById('newNameX').select();
}

async function doRename() {
  const name = document.getElementById('newNameX').value.trim();
  if (!name) return toast('名稱不能為空', 'err');
  try {
    await api('PATCH', `/api/classes/${curId}`, { name });
    toast('已重新命名', 'ok');
    ME = await api('GET', '/api/me');
    cur = ME.classes.find((c) => c.id === curId);
    renderSide(); renderContent();
  } catch (e) { toast(e.message, 'err'); }
}

async function doLeave() {
  if (!confirm('退出班級「' + cur.name + '」？')) return;
  try {
    await api('DELETE', `/api/classes/${curId}/members/${ME.user.id}`);
    toast('已退出該班級', 'ok');
    ME = await api('GET', '/api/me');
    curId = null; boot();
  } catch (e) { toast(e.message, 'err'); }
}

async function copyBind() {
  const code = document.getElementById('bindCode').textContent.trim();
  toast((await copyText(code)) ? '綁定碼已複製' : '請手動複製: ' + code, 'ok');
}
function pickColor(el, c) {
  msgColor = c;
  document.querySelectorAll('#swatches .sw').forEach((x) => x.classList.toggle('on', x === el));
}

function fmtDuration(s) {
  if (s === -1) return '手動關閉';
  if (!s) return '';
  if (s < 60) return s + '秒';
  if (s < 3600) {
    const m = Math.floor(s / 60);
    const r = s % 60;
    return r === 0 ? m + '分鐘' : m + '分' + r + '秒';
  }
  const h = Math.floor(s / 3600);
  const m = Math.round((s % 3600) / 60);
  return m === 0 ? h + '小時' : h + '小時' + m + '分';
}
function durVal() {
  const sel = document.getElementById('selDuration');
  if (!sel) return 0;
  const mode = sel.value;
  if (mode === '-1') return -1;
  const inp = document.getElementById('inpDurNum');
  if (!inp) return 0;
  let n = Math.floor(Number(inp.value));
  if (!Number.isFinite(n) || n < 1) { n = 1; inp.value = 1; } // 未填或填 0 時依 1 個單位
  const sec = mode === 'hour' ? n * 3600 : n * 60;
  return Math.min(sec, 14400); // 最長 4 小時
}
function onDurChange() {
  const sel = document.getElementById('selDuration');
  if (!sel) return;
  const mode = sel.value;
  const wrap = document.getElementById('durInputWrap');
  const unit = document.getElementById('durUnit');
  const tip = document.getElementById('durTip');
  if (wrap) wrap.classList.toggle('hide', mode === '-1');
  if (unit) unit.textContent = mode === 'hour' ? '小時' : '分鐘';
  if (tip) tip.style.display = mode === '-1' ? '' : 'none';
}
function onModeChange() {
  const v = document.getElementById('selMode').value;
  document.getElementById('cfgOnce').classList.toggle('hide', v !== 'once');
  document.getElementById('cfgDaily').classList.toggle('hide', v !== 'daily');
  const b = document.getElementById('btnSend');
  b.textContent = v === 'now' ? '發送到教室 📢' : (v === 'daily' ? '開啟每日喊話 ⏰' : '安排定時喊話 ⏰');
}
function sendByMode() {
  return document.getElementById('selMode').value === 'now' ? doSend() : doSchedule();
}

async function doSend() {
  const content = document.getElementById('txtContent').value.trim();
  if (!content) return toast('請輸入通知內容', 'err');
  try {
    const res = await api('POST', `/api/classes/${curId}/notify`, {
      content, voice: document.getElementById('chkVoice').checked, color: msgColor, duration: durVal(),
    });
    const n = res.notification;
    gaEvent('notify_sent', { mode: 'now', voice: document.getElementById('chkVoice').checked, long_stay: durVal() === -1 ? 1 : 0, delivered: n.delivered ? 1 : 0 });
    toast(n.delivered ? '已發送，教室端正在播報' : '已發送，但教室端目前離線（可能無法播報）', n.delivered ? 'ok' : 'err');
    document.getElementById('txtContent').value = '';
    refreshNotifs();
  } catch (e) { toast(e.message, 'err'); }
}

async function doSchedule() {
  const content = document.getElementById('txtContent').value.trim();
  if (!content) return toast('請輸入喊話內容', 'err');
  const v = document.getElementById('selMode').value;
  const common = { content, voice: document.getElementById('chkVoice').checked, color: msgColor, duration: durVal() };
  try {
    let msg;
    if (v === 'once') {
      const at = document.getElementById('inpOnceAt').value;
      if (!at) return toast('請先選擇發送的日期時間', 'err');
      const res = await api('POST', `/api/classes/${curId}/jobs`, { ...common, type: 'once', runAt: new Date(at).toISOString() });
      msg = '已安排定時喊話, 將於 ' + fmtTime(res.job.runAt) + ' 自動播報';
    } else {
      const tm = document.getElementById('inpDailyAt').value;
      if (!tm) return toast('請先選擇每天播報的時間', 'err');
      const res = await api('POST', `/api/classes/${curId}/jobs`, { ...common, type: 'daily', time: tm });
      msg = '已開啟每日喊話, 每天 ' + res.job.hm + ' 自動播報';
    }
    gaEvent('notify_scheduled', { mode: v, voice: document.getElementById('chkVoice').checked });
    toast(msg, 'ok');
    document.getElementById('txtContent').value = '';
    document.getElementById('selMode').value = 'now';
    onModeChange();
    refreshJobs();
  } catch (e) { toast(e.message, 'err'); }
}

async function refreshJobs() {
  if (!curId) return;
  try {
    const { jobs } = await api('GET', `/api/classes/${curId}/jobs`);
    const box = document.getElementById('jobList');
    if (!box) return;
    if (!jobs.length) { box.innerHTML = '<div class="empty-state" style="padding:22px">暫無定時喊話<br><span class="muted" style="font-size:13px">在上方展開「停留時長 / 定時喊話」可安排</span></div>'; return; }
    box.innerHTML = jobs.map((j) => `
      <div class="msg-item">
        <div class="msg-bar" style="background:${esc(j.color || '#e11d48')}"></div>
        <div class="grow" style="min-width:0">
          <div class="row" style="gap:8px;flex-wrap:wrap">
            ${j.type === 'daily' ? '<span class="badge badge-warn">每天 ' + esc(j.hm) + '</span>' : '<span class="badge badge-pri">單次</span>'}
            <span class="muted" style="font-size:12px">下次執行: ${fmtTime(j.runAt)}</span>
            ${j.voice === false ? '<span class="badge">靜音</span>' : '<span class="badge badge-pri">🔊 播報</span>'}
            ${j.duration ? '<span class="badge">停留' + fmtDuration(j.duration) + '</span>' : ''}
          </div>
          <div style="margin-top:4px;word-break:break-word">${esc(j.content)}</div>
        </div>
        <button class="btn btn-sm" data-ga="job_run_now" data-ga-pos="jobs" onclick="runJobNow('${j.id}')">立即喊一次</button>
        <button class="btn btn-sm btn-danger" data-ga="job_cancel" data-ga-pos="jobs" onclick="cancelJob('${j.id}')">取消</button>
      </div>`).join('');
  } catch (e) { /* ignore */ }
}
async function cancelJob(id) {
  try {
    await api('DELETE', `/api/classes/${curId}/jobs/${id}`);
    toast('已取消該定時喊話', 'ok');
    refreshJobs();
  } catch (e) { toast(e.message, 'err'); }
}
async function runJobNow(id) {
  try {
    const r = await api('POST', `/api/classes/${curId}/jobs/${id}/run`);
    toast(r.delivered ? '已立即喊出, 教室端正在播報' : '已觸發, 但教室端離線未送達', r.delivered ? 'ok' : 'err');
    refreshJobs(); refreshNotifs();
  } catch (e) { toast(e.message, 'err'); }
}

async function sendTest() {
  try {
    const res = await api('POST', `/api/classes/${curId}/notify`, { content: '測試播報：通知系統運作正常，聲音正常。', voice: true, color: msgColor });
    gaEvent('notify_test', { delivered: res.notification.delivered ? 1 : 0 });
    toast(res.notification.delivered ? '測試通知已播報' : '教室端離線，測試通知未送達', res.notification.delivered ? 'ok' : 'err');
    refreshNotifs();
  } catch (e) { toast(e.message, 'err'); }
}

async function remoteMinimize() {
  try {
    await api('POST', `/api/classes/${curId}/minimize`);
    toast('已發送最小化指令', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

function renderInviteCode(codeObj) {
  const genRow = document.getElementById('codeGenRow');
  const row = document.getElementById('codeRow');
  const codeEl = document.getElementById('invCode');
  const hint = document.getElementById('codeHint');
  if (!genRow || !row) return;
  if (codeObj && codeObj.code) {
    genRow.style.display = 'none';
    row.style.display = 'block';
    codeEl.textContent = codeObj.code;
    hint.textContent = '邀請碼長期有效、可多人使用；點選「作廢」或「重新產生」可讓舊碼失效。';
  } else {
    genRow.style.display = 'flex';
    row.style.display = 'none';
    codeEl.textContent = '';
    hint.textContent = '點選產生一個邀請碼，發給協同老師使用。';
  }
}

async function revokeInviteCode() {
  if (!confirm('作廢目前邀請碼？作廢後原邀請碼將無法再被使用，可隨時重新產生。')) return;
  try {
    await api('DELETE', `/api/classes/${curId}/invite-code`);
    renderInviteCode(null);
    toast('邀請碼已作廢', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function loadCoManage() {
  const list = document.getElementById('coList');
  if (!list) return;
  try {
    const data = await api('GET', `/api/classes/${curId}/invites`);
    renderInviteCode(data.code);
    list.innerHTML = '<div class="muted" style="font-size:13px;margin-bottom:6px">已加入協同老師:</div>' +
      (data.members.length ? data.members.map((m) => `
        <div class="row spread" style="padding:6px 0">
          <span><b>${esc(m.username)}</b> <span class="badge badge-warn">協同</span></span>
          <button class="btn btn-sm btn-danger" data-ga="member_remove" data-ga-pos="co_manage" onclick="removeMember('${m.id}')">移除</button>
        </div>`).join('') : '<div class="muted" style="font-size:13px">暫無，把上方邀請碼發給協同老師即可加入</div>');
  } catch (e) { /* ignore */ }
}

async function makeInviteCode() {
  try {
    const r = await api('POST', `/api/classes/${curId}/invite-code`);
    renderInviteCode(r);
    toast('已產生邀請碼', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function copyInviteCode() {
  const v = (document.getElementById('invCode').textContent || '').trim();
  if (!v) return toast('請先產生邀請碼', 'err');
  toast((await copyText(v)) ? '邀請碼已複製' : '請手動複製', 'ok');
}

/* 協同帳號: 輸入邀請碼加入班級 */
function renderJoinBox() {
  const box = document.getElementById('joinBox');
  if (!box) return;
  if (ME.user.type !== 'co') { box.innerHTML = ''; return; }
  box.innerHTML = `
    <div class="card" style="padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="badge badge-pri" style="font-size:13px">🔑 加入班級</span>
      <input class="inp grow" id="joinCode" placeholder="輸入班主任給你的邀請碼" maxlength="12" style="text-transform:uppercase;letter-spacing:2px">
      <button class="btn btn-pri btn-sm" data-ga="join_by_code" data-ga-pos="join_box" onclick="joinByCode()">加入</button>
    </div>`;
}

async function joinByCode() {
  const el = document.getElementById('joinCode');
  if (!el) return;
  const code = (el.value || '').trim().toUpperCase();
  if (!code) return toast('請輸入邀請碼', 'err');
  try {
    const r = await api('POST', '/api/invite-code/accept', { code });
    toast(r.already ? '你已在該班級中' : '已加入班級「' + (r.className || '') + '」', 'ok');
    ME = await api('GET', '/api/me');
    curId = null;
    boot();
  } catch (e) { toast(e.message, 'err'); }
}

async function removeMember(uid) {
  if (!confirm('將該老師移出本班？')) return;
  try {
    await api('DELETE', `/api/classes/${curId}/members/${uid}`);
    toast('已移除', 'ok');
    ME = await api('GET', '/api/me');
    cur = ME.classes.find((c) => c.id === curId);
    loadCoManage();
  } catch (e) { toast(e.message, 'err'); }
}

async function handleInvite(id, act) {
  try {
    await api('POST', `/api/invites/${id}/${act}`);
    toast(act === 'accept' ? '已接受邀請' : '已拒絕', 'ok');
    ME = await api('GET', '/api/me');
    renderInvites();
    curId = null; boot();
  } catch (e) { toast(e.message, 'err'); }
}

async function doLogout() {
  const isTrial = !!(ME.user && ME.user.trial);
  try { await api('POST', '/api/auth/logout'); } catch (e) {}
  location.href = isTrial ? '/zh-Hant/' : '/zh-Hant/login';
}

/* ================= 教室線上輪詢 ================= */
function applyPresence() {
  ME.classes.forEach((c) => {
    document.querySelectorAll(`[data-cid="${c.id}"]`).forEach((el) => {
      const d = el.querySelector('.dot');
      const st = el.querySelector('.st');
      if (!d) return;
      d.classList.toggle('on', c.online);
      d.classList.toggle('off', !c.online);
      if (st) st.textContent = c.online ? '教室線上' : '教室離線';
    });
  });
}

async function pollPresence() {
  if (!ME) return;
  try {
    const me = await api('GET', '/api/me');
    me.classes.forEach((nc) => {
      const old = ME.classes.find((x) => x.id === nc.id);
      if (old) old.online = nc.online;
    });
    applyPresence();
  } catch (e) { /* ignore */ }
}

/* ================= 啟動 ================= */
(async function init() {
  try {
    ME = await api('GET', '/api/me');
    window.GA_CTX = { trial: ME.user.trial ? 1 : 0, acct: ME.user.type };   // 讓之後所有埋點自動帶上帳號類型
    boot();
    renderTrial();
    setInterval(pollPresence, 6000);
    // 渲染內容後載入協同老師列表
    setInterval(() => { if (cur && cur.isOwner && document.getElementById('coList')) loadCoManage(); }, 10000);
    // 定時喊話列表自動重新整理(到時執行後及時移除)
    setInterval(() => { if (document.getElementById('jobList')) refreshJobs(); }, 10000);
  } catch (e) {
    if (e.message !== '尚未登入') toast(e.message, 'err');
  }
})();
</script>
