<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登入 · 班級喊話系統</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<select class="lang-select floating" title="切換語言" aria-label="切換語言" onchange="if(this.value)location.href=this.value">
  <option value="/login">简体</option>
  <option value="/zh-Hant/login" selected>繁體</option>
  <option value="/en/login">English</option>
</select>
<div class="auth-bg">
  <div class="auth-box">
    <a class="back-home" href="/zh-Hant/">← 返回首頁</a>
    <div class="brand">
      <div class="logo">📢</div>
      <div>
        <h1>班級喊話系統</h1>
        <p>網頁發通知 · 教室自動全螢幕播報</p>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <button id="tabLogin" class="on" onclick="showTab('login')">登入</button>
        <button id="tabReg" onclick="showTab('reg')">註冊帳號</button>
        <button id="tabForgot" onclick="showTab('forgot')">忘記密碼</button>
      </div>

      <!-- 登入 -->
      <form class="auth-pane" id="paneLogin" onsubmit="return doLogin(event)">
        <h2>登入後台</h2>
        <label class="lbl">使用者名稱</label>
        <input class="inp" id="liUser" autocomplete="username" required>
        <label class="lbl">密碼</label>
        <input class="inp" id="liPass" type="password" autocomplete="current-password" required>
        <div style="height:18px"></div>
        <button class="btn btn-pri btn-block" type="submit">登 入</button>
        <p class="sub" style="margin:15px 0 0;text-align:center">
          還沒帳號？<a href="/try?to=/zh-Hant/app"><b>免註冊體驗</b></a>，直接進一個臨時後台試試
        </p>
      </form>

      <!-- 註冊 -->
      <form class="auth-pane hide" id="paneReg" onsubmit="return doReg(event)">
        <h2>註冊帳號</h2>
        <p class="sub">第一次使用需啟用卡號，註冊成功自動進入後台</p>
        <label class="lbl">啟用卡號</label>
        <input class="inp mono" id="rgCard" placeholder="例如 OWN-XXXX-XXXX" style="letter-spacing:1px">
        <label class="lbl">登入使用者名稱（請牢記，找回密碼需用到）</label>
        <input class="inp" id="rgUser" maxlength="20" required>
        <label class="lbl">密碼(至少 6 位)</label>
        <input class="inp" id="rgPass" type="password" required>
        <label class="lbl">確認密碼</label>
        <input class="inp" id="rgPass2" type="password" required>
        <label class="lbl">班級邀請碼（選填 · 協同老師填寫）</label>
        <input class="inp mono" id="rgInvite" placeholder="班主任給你的邀請碼" maxlength="12" style="text-transform:uppercase;letter-spacing:2px">
        <div style="height:18px"></div>
        <button class="btn btn-pri btn-block" type="submit">立即註冊</button>
        <p class="sub" style="margin:12px 0 0;line-height:1.6" id="rgTip">普通啟用卡註冊後自帶 2 個班級；協同授權碼（CO- 開頭）註冊的是協同帳號，不能新建班級</p>

        <!-- 申請啟用卡號 -->
        <div class="req-box" id="reqBox">
          <div class="req-h">還沒有啟用卡號？</div>
          <p class="req-p">
            只需填寫你的聯絡電子信箱，我們會盡快把啟用卡號寄給你。洽詢信箱
            <b class="mono" id="reqMail">ladyiney25@gmail.com</b>
            <button class="btn btn-sm" type="button" onclick="copyReqMail()">複製</button>
          </p>
          <input class="inp" id="reqContact" type="email" placeholder="你的聯絡電子信箱，例如 teacher@example.com"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();submitCardRequest();}">
          <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap">
            <button class="btn btn-pri btn-sm" type="button" id="reqBtn" onclick="submitCardRequest()">提交申請</button>
          </div>
        </div>
      </form>

      <!-- 忘記密碼 -->
      <form class="auth-pane hide" id="paneForgot" onsubmit="return doForgot(event)">
        <h2>找回密碼</h2>
        <p class="sub">輸入使用者名稱 + 註冊時使用的啟用卡號</p>
        <label class="lbl">使用者名稱</label>
        <input class="inp" id="foUser" required>
        <label class="lbl">啟用卡號</label>
        <input class="inp mono" id="foCard" placeholder="例如 OWN-XXXX-XXXX">
        <label class="lbl">新密碼(至少 6 位)</label>
        <input class="inp" id="foPass" type="password" required>
        <div style="height:18px"></div>
        <button class="btn btn-pri btn-block" type="submit">重設密碼</button>
        <p class="sub" style="margin:12px 0 0;line-height:1.6">卡號也忘了？寄信到 <b>ladyiney25@gmail.com</b> 說明狀況，我們幫你找回。</p>
      </form>
    </div>
  </div>
</div>

<script src="/zh-Hant/common.js"></script>
<script>
const REQ_EMAIL = 'ladyiney25@gmail.com';

function showTab(t) {
  ['login', 'reg', 'forgot'].forEach((k) => {
    document.getElementById('pane' + k[0].toUpperCase() + k.slice(1)).classList.toggle('hide', k !== t);
    document.getElementById('tab' + k[0].toUpperCase() + k.slice(1)).classList.toggle('on', k === t);
  });
}

async function doLogin(e) {
  e.preventDefault();
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  try {
    await api('POST', '/api/auth/login', { username: liUser.value.trim(), password: liPass.value });
    location.href = '/zh-Hant/app';
  } catch (err) {
    toast(err.message, 'err'); btn.disabled = false;
  }
}

async function doReg(e) {
  e.preventDefault();
  if (rgPass.value.length < 6) return toast('密碼至少 6 位', 'err');
  if (rgPass.value !== rgPass2.value) return toast('兩次輸入的密碼不一致', 'err');
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  try {
    await api('POST', '/api/auth/register', {
      username: rgUser.value.trim(), password: rgPass.value, cardCode: rgCard.value.trim(),
    });
    await joinByInviteCode((rgInvite.value || '').trim().toUpperCase());
    location.href = '/zh-Hant/app';
  } catch (err) {
    toast(err.message, 'err'); btn.disabled = false;
  }
}

/* 註冊時填了邀請碼 → 自動加入對應班級 */
async function joinByInviteCode(code) {
  if (!code) return;
  try {
    const r = await api('POST', '/api/invite-code/accept', { code });
    toast(r.already ? '你已在該班級中' : '已加入班級「' + (r.className || '') + '」', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

async function doForgot(e) {
  e.preventDefault();
  if (foPass.value.length < 6) return toast('新密碼至少 6 位', 'err');
  const btn = e.target.querySelector('button[type=submit]');
  btn.disabled = true;
  try {
    await api('POST', '/api/auth/forgot', { username: foUser.value.trim(), cardCode: foCard.value.trim(), password: foPass.value });
    toast('密碼已重設, 請重新登入', 'ok');
    showTab('login');
  } catch (err) {
    toast(err.message, 'err');
  } finally { btn.disabled = false; }
}

/* ---------- 申請啟用卡號 ---------- */
function reqPayload() {
  return {
    contact: (document.getElementById('reqContact').value || '').trim(),
    lang: 'zh-Hant',
  };
}

async function submitCardRequest() {
  const p = reqPayload();
  if (p.contact.length < 3) return toast('請先填寫聯絡電子信箱', 'err');
  const btn = document.getElementById('reqBtn');
  btn.disabled = true;
  try {
    await api('POST', '/api/card-request', p);
    toast('申請已提交，我們會在 1 個工作日內與你聯絡', 'ok');
  } catch (err) {
    toast(err.message, 'err');
  } finally { btn.disabled = false; }
}

async function copyReqMail() {
  const ok = await copyText(REQ_EMAIL);
  toast(ok ? '電子信箱已複製：' + REQ_EMAIL : '請手動複製：' + REQ_EMAIL, ok ? 'ok' : 'err');
}

/* 從落地頁帶 #reg / #card 進來時直接定位到對應位置 */
(function applyHash() {
  const h = (location.hash || '').toLowerCase();
  if (h !== '#reg' && h !== '#card') return;
  showTab('reg');
  if (h === '#card') {
    setTimeout(() => {
      const box = document.getElementById('reqBox');
      if (!box) return;
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      box.classList.add('hl');
    }, 120);
  }
})();
</script>
</body>
</html>
