<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>班級喊話 · 教室端</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="room-stage">

  <!-- 頂部 -->
  <div class="room-top" id="topBar">
    <div class="row" style="gap:10px">
      <span style="font-weight:700;font-size:16px">📢 教室喊話端</span>
      <span class="chip" id="stateChip"><span class="dot gray" id="stateDot"></span><span id="stateText">未連線</span></span>
    </div>
    <div class="row" style="flex-wrap:wrap;gap:8px">
      <select class="lang-select on-dark" title="切換語言" aria-label="切換語言" style="margin-right:4px" onchange="if(this.value)location.href=this.value">
        <option value="/room">简体</option>
        <option value="/zh-Hant/room" selected>繁體</option>
        <option value="/en/room">English</option>
      </select>
      <button class="btn btn-sm" id="btnSound" onclick="toggleSound()" style="background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)">🔊 聲音開</button>
      <button class="btn btn-sm" onclick="toggleFull()" style="background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)">⛶ 全螢幕</button>
      <button class="btn btn-sm" onclick="doTest()" style="background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)">測試播報</button>
      <button class="btn btn-sm btn-danger" onclick="doUnbind()">解除綁定</button>
      <button class="btn btn-sm" id="btnMinWait" onclick="toggleWaitMode()" style="display:none;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)">📥 縮成小窗待命</button>
      <button class="btn btn-sm" id="btnAuto" onclick="toggleAutoLaunch()" style="display:none;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)">⚡ 開機自動啟動:關</button>
      <button class="btn btn-sm" id="btnDesktopExit" onclick="desktopQuit()" style="display:none;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)">⏻ 結束教室端</button>
    </div>
  </div>

  <!-- 綁定 -->
  <div class="room-main" id="setupPanel">
    <form class="bind-card" onsubmit="return doBind(event)">
      <h2>綁定班級</h2>
      <p class="sub">請老師在後台建立班級後，將 <b>綁定碼</b> 填入此處。綁定一次即可，之後開機自動連線。</p>
      <label class="lbl" style="color:#c7cddd">班級綁定碼</label>
      <input class="inp mono" id="codeInp" maxlength="12" placeholder="輸入班級綁定碼" autocomplete="off" required>
      <div style="height:16px"></div>
      <button class="btn btn-pri btn-block" type="submit" id="bindBtn">連線並開始接收通知</button>
    </form>
  </div>

  <!-- 等待 -->
  <div class="room-main hide" id="mainPanel">
    <div class="waiting" style="text-align:center">
      <span class="chip" style="font-size:18px;padding:10px 20px">
        <span class="dot" id="mainDot"></span>
        <span id="className">正在連線…</span>
      </span>
    </div>
    <div class="big-clock" id="clock">--:--</div>
    <div class="pulse" style="letter-spacing:6px;color:#a5b4fc;font-size:18px">正在監聽通知</div>
    <div id="unlockPill" class="chip hide" onclick="unlockAudio()" style="cursor:pointer;border-color:#fbbf24;color:#fde68a">
      🔊 點選此處開啟語音播報
    </div>
    <div style="color:#6b7280;font-size:13px" id="roomHint">收到老師通知後會自動全螢幕彈出並語音播報</div>
  </div>
</div>

<!-- 通知全螢幕彈出層 -->
<div class="ov hide" id="overlay">
  <div class="ov-inner">
    <div class="ov-head" id="ovHead">
      <div class="ov-tag" id="ovTag"></div>
      <button class="ov-x" onclick="closeOverlay()">✕</button>
    </div>
    <div class="ov-body"><div class="txt" id="ovText"></div></div>
    <div class="ov-foot">
      <span id="ovFrom"></span>
      <span id="ovFootHint">班級喊話系統 · 點選右上角關閉</span>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/zh-Hant/common.js"></script>
<script>
/* ---------- 狀態 ---------- */
let code = localStorage.getItem('room_code') || '';
/* 支援 /room?code=XXXXXX 直接綁定(一鍵體驗引導用), 優先於本機記錄 */
(function () {
  let q = '';
  try { q = new URLSearchParams(location.search).get('code') || ''; } catch (e) { q = ''; }
  if (q) { code = q.trim().toUpperCase(); localStorage.setItem('room_code', code); }
})();
let soundOn = localStorage.getItem('room_sound') !== '0';
let audioUnlocked = false;
let className = '';
let classColor = '#4f46e5';
let overlayTimer = null;
let lastRead = '';
let waitMode = localStorage.getItem('room_waitmode') === '1'; // 桌面端待命模式:平時最小化,通知自動彈出
let openedByNotify = false; // 本次是否由通知彈出(彈完自動收回)
let manualBind = false; // 是否是老師手動重新綁定(手動綁定時不自動收走視窗)

const socket = io();

/* ---------- 語音 ---------- */
let zhVoice = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    // 優先台灣中文語音, 其次任何中文語音
    zhVoice = vs.find((v) => /^zh[-_]TW/i.test(v.lang))
      || vs.find((v) => /^zh[-_]Hant/i.test(v.lang))
      || vs.find((v) => /^zh/i.test(v.lang))
      || vs.find((v) => /Chinese|Mandarin/i.test(v.name)) || null;
  } catch (e) { zhVoice = null; }
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function unlockAudio() {
  audioUnlocked = true;
  document.getElementById('unlockPill').classList.add('hide');
  try { speechSynthesis.resume(); } catch (e) {}
}
document.addEventListener('pointerdown', () => {
  if (!audioUnlocked && className) { unlockAudio(); }
}, { once: false });

function speak(text) {
  if (!soundOn) return;
  if (!window.speechSynthesis || !audioUnlocked) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-TW';
    u.rate = 1.05;
    if (zhVoice) u.voice = zhVoice;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) { /* 略過 */ }
}

function beep() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    [880, 1320].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = f;
      const t = ctx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.start(t); o.stop(t + 0.18);
    });
  } catch (e) { /* 略過 */ }
}

/* ---------- 綁定 / 狀態 ---------- */
function setState(txt, ok) {
  document.getElementById('stateText').textContent = txt;
  const d = document.getElementById('stateDot');
  d.className = 'dot';
  if (ok === true) d.classList.add('on');
  else if (ok === false) { d.classList.add('gray'); }
}

function showSetup() {
  document.getElementById('mainPanel').classList.add('hide');
  document.getElementById('setupPanel').classList.remove('hide');
  setState('未綁定', false);
}

function showMain() {
  document.getElementById('setupPanel').classList.add('hide');
  document.getElementById('mainPanel').classList.remove('hide');
}

async function doBind(e) {
  e.preventDefault();
  const val = document.getElementById('codeInp').value.trim().toUpperCase();
  if (!val) return;
  code = val;
  manualBind = true;
  unlockAudio(); // 使用者點擊 = 允許語音
  setState('正在綁定…', null);
  document.getElementById('bindBtn').disabled = true;
  socket.emit('bind', { code });
}

socket.on('connect', () => {
  if (code) { setState('正在重連…', null); socket.emit('bind', { code }); }
});
socket.on('disconnect', () => {
  if (code) setState('網路中斷，重連中…', false);
});

socket.on('bound', (r) => {
  document.getElementById('bindBtn').disabled = false;
  if (r.ok) {
    code = r.code || code;
    localStorage.setItem('room_code', code);
    className = r.className;
    classColor = r.color || classColor;
    document.getElementById('className').textContent = '已綁定 · ' + className;
    document.getElementById('mainDot').classList.remove('gray');
    document.getElementById('roomHint').textContent = '班級【' + className + '】已綁定，收到通知自動全螢幕播報。';
    showMain();
    setState('線上 · 接收中', true);
    if (!audioUnlocked) document.getElementById('unlockPill').classList.remove('hide');
    toast('綁定成功：' + className, 'ok');
    tickClock(); setInterval(tickClock, 1000);
    // 待命模式(開機自動啟動還原時):綁定確認後自動收到工作列待命
    if (waitMode && window.desktopApp && !manualBind) setTimeout(() => { try { window.desktopApp.minimize(); } catch (e) {} }, 900);
  } else {
    code = ''; localStorage.removeItem('room_code');
    showSetup();
    setState('綁定失敗', false);
    toast(r.error || '綁定失敗', 'err');
  }
});

socket.on('notify', (m) => {
  openedByNotify = true;
  if (window.desktopApp) { try { window.desktopApp.pulse(); } catch (e) {} }
  beep();
  showNotify(m);
  if (m.voice !== false) speak(m.content);
});

socket.on('rebind', (m) => {
  code = ''; localStorage.removeItem('room_code');
  openedByNotify = false;
  if (waitMode) setWaitMode(false);
  closeOverlay();
  speechSynthesis.cancel && speechSynthesis.cancel();
  showSetup();
  toast((m && m.reason) || '綁定碼已更新，請重新綁定', 'err');
});

socket.on('minimize', () => {
  closeOverlay();
  if (window.desktopApp) {
    try { window.desktopApp.minimize(); } catch (e) {}
  }
});

/* ---------- 通知彈出層 ---------- */
function displayMs(m) {
  const len = (m.content || '').length;
  if (m.duration === -1) return 0; // 老師選了「不自動關閉」: 一直顯示, 手動關了才收起
  if (typeof m.duration === 'number' && m.duration > 0) {
    // 老師設定了停留時長; 若語音較長則至少等語音播完再收起
    const cfgMs = m.duration * 1000;
    const speakMs = Math.min(len * 250, 60000);
    return Math.max(cfgMs, speakMs);
  }
  return Math.max(12000, Math.min(len * 400, 60000)); // 預設: 依字數 12~60 秒
}
function showNotify(m) {
  lastRead = m.content;
  document.getElementById('ovHead').style.background = m.color || '#e11d48';
  document.getElementById('ovTag').textContent = '📢 ' + (m.className || '班級通知');
  document.getElementById('ovText').textContent = m.content;
  document.getElementById('ovFrom').textContent = '來源：' + (m.fromName || '') + ' · ' + (m.sentAt ? fmtTime(m.sentAt) : '');
  const ov = document.getElementById('overlay');
  ov.classList.remove('hide');
  if (document.fullscreenEnabled) { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} }
  const stay = displayMs(m);
  const hint = document.getElementById('ovFootHint');
  if (hint) hint.textContent = stay === 0 ? '需手動關閉 · 點選右上角 ✕' : '班級喊話系統 · 點選右上角關閉';
  clearTimeout(overlayTimer);
  overlayTimer = stay > 0 ? setTimeout(closeOverlay, stay) : null; // 0 = 不自動關閉
}
function closeOverlay() {
  document.getElementById('overlay').classList.add('hide');
  clearTimeout(overlayTimer);
  // 待命模式下,通知播完自動收到工作列,不佔螢幕
  if (waitMode && openedByNotify && window.desktopApp) {
    openedByNotify = false;
    setTimeout(() => { try { window.desktopApp.minimize(); } catch (e) {} }, 400);
  }
}

/* ---------- 按鈕 ---------- */
function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('room_sound', soundOn ? '1' : '0');
  document.getElementById('btnSound').textContent = soundOn ? '🔊 聲音開' : '🔇 聲音關';
  if (soundOn) unlockAudio();
  else { try { speechSynthesis.cancel(); } catch (e) {} }
  toast(soundOn ? '語音播報已開啟' : '語音播報已關閉', 'ok');
}

function doTest() {
  unlockAudio();
  if (className) {
    beep();
    showNotify({ content: '測試播報：聲音正常，通知正常接收。', className, color: '#2563eb', fromName: '本機測試', sentAt: null, voice: true });
    speak('測試播報：聲音正常，通知正常接收。');
  } else {
    toast('請先綁定班級', 'err');
  }
}

function doUnbind() {
  code = ''; className = '';
  localStorage.removeItem('room_code');
  closeOverlay();
  showSetup();
  toast('已解除綁定', 'ok');
}

function toggleFull() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  } catch (e) {}
}

function desktopQuit() {
  if (window.desktopApp) window.desktopApp.quit();
  else toggleFull();
}

/* 桌面教室端殼裡顯示「開機自動啟動」與「結束教室端」按鈕 */
let autoLaunch = false;
function renderAutoBtn() {
  const b = document.getElementById('btnAuto');
  if (b) b.textContent = '⚡ 開機自動啟動:' + (autoLaunch ? '開' : '關');
}
async function toggleAutoLaunch() {
  const b = document.getElementById('btnAuto');
  const want = !autoLaunch;
  if (b) b.disabled = true;
  try {
    const r = await window.desktopApp.setAutoLaunch(want);
    if (r && r.ok) { autoLaunch = !!r.value; renderAutoBtn(); toast('開機自動啟動已' + (autoLaunch ? '開啟' : '關閉') + '，下次開機自動進入本螢幕', 'ok'); }
    else toast((r && r.error) || '設定失敗', 'err');
  } catch (e) { toast('設定失敗', 'err'); }
  if (b) b.disabled = false;
}
function renderWaitBtn() {
  const el = document.getElementById('btnMinWait');
  if (!el) return;
  el.textContent = waitMode ? '📌 固定在螢幕上顯示' : '📥 縮成小窗待命';
}
function setWaitMode(v) {
  waitMode = !!v;
  localStorage.setItem('room_waitmode', waitMode ? '1' : '0');
  renderWaitBtn();
  if (waitMode && window.desktopApp) { try { window.desktopApp.minimize(); } catch (e) {} }
}
function toggleWaitMode() {
  setWaitMode(!waitMode);
  toast(waitMode ? '待命模式已開啟：平時收成右下角小視窗，收到老師通知會自動彈回全螢幕並播報，播完自動縮回小視窗' : '已切回常顯模式：螢幕保持顯示待機畫面', 'ok');
}
if (window.desktopApp) {
  const b = document.getElementById('btnDesktopExit');
  if (b) b.style.display = '';
  const mb = document.getElementById('btnMinWait');
  if (mb) mb.style.display = '';
  renderWaitBtn();
  const ab = document.getElementById('btnAuto');
  if (ab) { ab.style.display = ''; renderAutoBtn(); }
  window.desktopApp.getAutoLaunch().then((r) => {
    if (r && r.ok) { autoLaunch = !!r.value; renderAutoBtn(); }
  }).catch(() => {});
}

function tickClock() {
  const el = document.getElementById('clock');
  const d = new Date();
  el.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
}

/* ---------- 啟動 ---------- */
if (soundOn) document.getElementById('btnSound').textContent = '🔊 聲音開';
else document.getElementById('btnSound').textContent = '🔇 聲音關';
if (code) {
  showMain();
  setState('正在連線…', null);
  document.getElementById('className').textContent = '正在連線…';
  socket.emit('bind', { code }); // socket 可能未就緒, 依賴 connect 事件兜底
  // 若已連線過(connect已觸發)不會再次觸發, 這裡做相容
  if (socket.connected) socket.emit('bind', { code });
} else {
  showSetup();
}
tickClock();
setInterval(tickClock, 1000);
</script>
</body>
</html>
